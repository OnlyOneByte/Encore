# Test harness wiring. Preloads the DOM + Svelte loader once before `bun test`, so component tests
# under src/lib/tv/ can mount the real player component and run its effects.
#
# The gate is `bun run test`, NOT `bun test`: `vaul-svelte` declares only a `svelte` export condition, so
# bun's test resolver cannot find it and a bare `bun test` fails while the build stays green. The fix is
# `--conditions=svelte`, which lives in package.json's `test` script — it CANNOT live here, since
# `conditions` under [test] and at top level were both measured as ignored by bun 1.3.14.
[test]
preload = ["./tests/setup/svelte-dom-preload.ts"]
