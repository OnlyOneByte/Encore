# There is no `[test] preload` any more: the component-mount harness (happy-dom + a Svelte compile hook +
# SvelteKit `$app/*` stubs) was deleted along with the 13 tests that used it. Component behaviour is the
# Chromium rung's job now — see docs/E2E.md.

# TWO RUNNERS, TWO CONVENTIONS. bun owns `tests/unit/**/*.test.ts`; Playwright owns
# `tests/playwright/**/*.spec.ts`. bun's default matcher globs `*.spec.ts` TOO, so without this root it walks
# into the Playwright tree and every spec dies on "Playwright Test did not expect test() to be called here" —
# a failure that reads as a broken spec rather than as the wrong runner having opened the file.
[test]
root = "tests/unit"
