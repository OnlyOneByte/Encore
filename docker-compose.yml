# Encore — one container for the MVP. The worker is gated behind the `stems` profile,
# so `docker compose up` runs ONLY core until you opt into stem-separation.
#   MVP:        docker compose up
#   With stems: docker compose --profile stems up
# Container hardening (Finding #4): no-new-privileges + cap_drop ALL on every service. The app
# is a plain HTTP/WS server that needs no Linux capabilities; dropping them shrinks the blast
# radius of any RCE. Runs as non-root `bun` (see Dockerfile USER).
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  core:
    <<: *hardening
    build:
      context: . # repo root — the Dockerfile copies packages/shared + apps/core
      dockerfile: apps/core/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MEDIA_STORE=local
      # The address the TV's join QR should advertise. Leave UNSET and it is derived from the request,
      # which is correct for phones and for a tunnel. Set it when the machine showing /tv cannot reach
      # its own public address — notably a Windows/WSL2 box, where the port proxy forwards traffic
      # arriving from the network but not the host's own loopback, so the only URL that opens /tv there
      # is localhost:3000 and the QR would tell every phone to connect to itself.
      #   ENCORE_PUBLIC_ORIGIN=http://10.69.1.169:3000
      - ENCORE_PUBLIC_ORIGIN=${ENCORE_PUBLIC_ORIGIN:-}
      # Storage classes, split by REPLACEABILITY (docs/ARCHITECTURE.md §2). Each defaults
      # under MEDIA_DIR, so these lines are documentation as much as configuration — point any one at
      # its own volume to separate the disks (audio on the big one, derived on the fast one).
      - MEDIA_DIR=/app/media
      - ENCORE_AUDIO_DIR=/app/media/audio # raw originals — NOT regenerable; this is what to back up
      - ENCORE_DERIVED_DIR=/app/media/derived # stems/pitch/lyrics/thumbs — safe to delete, recomputable
      - ENCORE_META_DIR=/app/media/meta # sidecar records — the authoritative library
    volumes:
      # Host paths are overridable from a .env so the volumes can move without editing this file.
      - ${ENCORE_DATA_VOLUME:-./data}:/app/data # sqlite (WAL)
      - ${ENCORE_MEDIA_VOLUME:-./media}:/app/media # audio + derived + meta + job scratch
    restart: unless-stopped

  worker:
    <<: *hardening
    # PID-1 zombie reaping. The worker runs `python -m src.dial_home` as PID 1, and
    # demucs/ffmpeg grandchildren reparent to it when their intermediate parent exits. Python is
    # not an init and does not reap them, so they accumulate as zombies over a long-running
    # worker. `init: true` interposes Docker's tiny init (tini) as PID 1 to reap them. No app change.
    init: true
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    profiles: ["stems"] # not started in the default MVP up
    environment:
      # The ONLY two settings a deployer must get right. Everything else the worker measures about
      # itself at startup: which accelerator is present, how many cores it may actually use, how much
      # memory, and which engines are installed (and therefore which capabilities it can honestly
      # advertise). See apps/worker/src/hardware.py and capabilities.py.
      - ENCORE_CORE_WS=ws://core:3000/ws?role=worker
      # MEDIA_DIR is set by the image; the volume below is what has to agree with core's.
      #
      # ── overrides, all optional and all unset by default ─────────────────────────────
      # Present so a measurement that turns out wrong on some box can be corrected without a rebuild.
      # Leave them empty unless you have measured a reason:
      #
      #   ENCORE_WORKER_CAPABILITIES  NARROWS what this box advertises (e.g. `fetch:ytdlp` for a
      #                               download-only worker). It can only subtract from what the worker
      #                               can prove — a claim it cannot honour is refused with a warning,
      #                               because that is what used to leave songs stuck at 0% forever.
      #   ENCORE_DEVICE               forces cpu/cuda/xpu/mps. An unreachable device fails LOUDLY at
      #                               startup, which is the point: naming it turns a driver or
      #                               passthrough mistake into a crash instead of a silent CPU cook.
      #   ENCORE_WORKER_CONCURRENCY   songs cooked at once. 1 is right until measured otherwise.
      #   ENCORE_DEMUCS_MODEL         htdemucs_ft = better, ~4x slower.
      #   ENCORE_DEMUCS_JOBS          parallel chunk jobs; auto-sized from usable cores.
      #   ENCORE_TORCH_THREADS        intra-op cap; auto-sized from concurrency x jobs.
      #   ENCORE_DEMUCS_OVERLAP/_SEGMENT/_SHIFTS, ENCORE_STEM_BITRATE, ENCORE_FLAC_LEVEL
      #
      # A worker id is derived from the hostname when unset, so two workers can no longer collide on a
      # shared default and silently replace each other in the core's registry.
      - ENCORE_WORKER_CAPABILITIES=${ENCORE_WORKER_CAPABILITIES:-}
      - ENCORE_DEVICE=${ENCORE_DEVICE:-}
      - ENCORE_WORKER_CONCURRENCY=${ENCORE_WORKER_CONCURRENCY:-}
      - ENCORE_DEMUCS_MODEL=${ENCORE_DEMUCS_MODEL:-}
      - ENCORE_DEMUCS_JOBS=${ENCORE_DEMUCS_JOBS:-}
      - ENCORE_DEMUCS_OVERLAP=${ENCORE_DEMUCS_OVERLAP:-}
      - ENCORE_DEMUCS_SEGMENT=${ENCORE_DEMUCS_SEGMENT:-}
      - ENCORE_DEMUCS_SHIFTS=${ENCORE_DEMUCS_SHIFTS:-}
      - ENCORE_TORCH_THREADS=${ENCORE_TORCH_THREADS:-}
      - ENCORE_STEM_BITRATE=${ENCORE_STEM_BITRATE:-}
      - ENCORE_FLAC_LEVEL=${ENCORE_FLAC_LEVEL:-}
    volumes:
      # Shares the local MediaStore volume (single-box mode). The worker writes raw audio into
      # audio/ and stems into derived/ using the SAME keys the core resolves — see
      # apps/worker/src/processor.py, which must stay byte-for-byte in step with core paths.ts.
      - ${ENCORE_MEDIA_VOLUME:-./media}:/app/media
      # Model + tool cache, kept OUT of the container's writable layer so it survives `docker rm`.
      # Holds the demucs checkpoints, the RoFormer checkpoint (~700 MB, fetched on the first
      # stems:roformer cook) and yt-dlp's JS challenge-solver script. Without this, replacing the
      # container re-downloads all of it — the same trap that made a hand-installed yt-dlp vanish.
      # A NAMED volume rather than a bind path on purpose: Docker initialises it from the image's
      # own $XDG_CACHE_HOME, so it inherits the worker's ownership, whereas a fresh bind directory
      # is created root-owned and the unprivileged worker cannot write to it.
      - worker-cache:/home/worker/.cache
    depends_on:
      - core
    restart: unless-stopped
    # deploy.resources.reservations.devices for GPU added when stems land

volumes:
  # Declared for the `stems` profile only; the default MVP `up` never creates it because the worker
  # service it belongs to is not started.
  worker-cache:
