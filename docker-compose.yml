# Encore — one container for the MVP. The worker is gated behind the `stems` profile:
#   MVP:        docker compose up
#   With stems: docker compose --profile stems up
#
# THIS FILE STAYS AT THE REPO ROOT while the Dockerfile lives in docker/. Compose resolves relative bind
# mounts AND loads `.env` from the PROJECT DIRECTORY, which defaults to wherever this file sits — so moving
# it under docker/ would quietly stop the root `.env` being read and leave every `${ENCORE_*}` below empty.
# `.dockerignore` stays at the root for the same class of reason: Docker reads it from the build CONTEXT,
# not from beside the Dockerfile.
# Hardening on every service: the app is a plain HTTP/WS server needing no Linux capabilities, so
# dropping them shrinks the blast radius of any RCE. Runs non-root (see Dockerfile USER).
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  core:
    <<: *hardening
    build:
      context: . # repo root — the Dockerfile copies the whole tree
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MEDIA_STORE=local
      # The address the TV's join QR advertises. UNSET = derived from the request, right for phones and
      # tunnels. Set it (e.g. http://10.69.1.169:3000) where /tv's own host cannot reach its public
      # address — notably WSL2, where the QR would otherwise tell every phone to connect to itself.
      - ENCORE_PUBLIC_ORIGIN=${ENCORE_PUBLIC_ORIGIN:-}
      # Storage classes, split by REPLACEABILITY (docs/ARCHITECTURE.md §2). Each defaults under
      # MEDIA_DIR — point any one at its own volume to separate the disks.
      - MEDIA_DIR=/app/media
      - ENCORE_AUDIO_DIR=/app/media/audio # raw originals — NOT regenerable; this is what to back up
      - ENCORE_DERIVED_DIR=/app/media/derived # stems/pitch/lyrics/thumbs — safe to delete, recomputable
      - ENCORE_META_DIR=/app/media/meta # sidecar records — the authoritative library
    volumes:
      # Host paths are overridable from a .env so the volumes can move without editing this file.
      - ${ENCORE_DATA_VOLUME:-./data}:/app/data # sqlite (WAL)
      - ${ENCORE_MEDIA_VOLUME:-./media}:/app/media # audio + derived + meta + job scratch
    restart: unless-stopped

  worker:
    <<: *hardening
    # PID-1 zombie reaping: demucs/yt-dlp grandchildren reparent to the worker, which runs as PID 1 and
    # is not an init, so they pile up. `init: true` interposes Docker's tini as PID 1 instead.
    init: true
    build:
      context: .
      dockerfile: worker/Dockerfile
    profiles: ["stems"] # not started in the default MVP up
    environment:
      # Two settings a deployer must get right: ENCORE_CORE_WS (where core is — no probe can guess it) and
      # MEDIA_DIR (the volume core is also using; set by the image, so it is the volume mapping below that
      # must agree, or core serves a file that is not there). Everything else the worker measures about
      # itself at startup — accelerator, usable cores, memory, installed engines. See src/host/hardware.py.
      - ENCORE_CORE_WS=ws://core:3000/ws?role=worker
      # The rest are optional and unset by default, so a wrong measurement is correctable without a
      # rebuild; one per-variable reference lives in README.md "Configuration". Note that
      # ENCORE_WORKER_CAPABILITIES can only NARROW what host/capabilities.py proves.
      - ENCORE_WORKER_CAPABILITIES=${ENCORE_WORKER_CAPABILITIES:-}
      - ENCORE_DEVICE=${ENCORE_DEVICE:-}
      - ENCORE_WORKER_CONCURRENCY=${ENCORE_WORKER_CONCURRENCY:-}
      - ENCORE_DEMUCS_MODEL=${ENCORE_DEMUCS_MODEL:-}
      - ENCORE_DEMUCS_JOBS=${ENCORE_DEMUCS_JOBS:-}
      - ENCORE_DEMUCS_OVERLAP=${ENCORE_DEMUCS_OVERLAP:-}
      - ENCORE_DEMUCS_SEGMENT=${ENCORE_DEMUCS_SEGMENT:-}
      - ENCORE_DEMUCS_SHIFTS=${ENCORE_DEMUCS_SHIFTS:-}
      - ENCORE_TORCH_THREADS=${ENCORE_TORCH_THREADS:-}
      - ENCORE_STEM_BITRATE=${ENCORE_STEM_BITRATE:-}
      - ENCORE_FLAC_LEVEL=${ENCORE_FLAC_LEVEL:-}
    volumes:
      # Shares the local MediaStore volume (single-box mode), using the SAME keys the core resolves —
      # worker/src/processor.py must stay byte-for-byte in step with src/lib/server/media/paths.ts.
      - ${ENCORE_MEDIA_VOLUME:-./media}:/app/media
      # Model + tool cache (demucs checkpoints, the ~700 MB RoFormer checkpoint, yt-dlp's solver script),
      # kept OUT of the writable layer so it survives `docker rm`. NAMED rather than a bind path on
      # purpose: Docker initialises it from the image's own $XDG_CACHE_HOME so it inherits the worker's
      # ownership, whereas a fresh bind directory is created root-owned and unwritable by the worker.
      - worker-cache:/home/worker/.cache
    depends_on:
      - core
    restart: unless-stopped
    # deploy.resources.reservations.devices for GPU added when stems land

volumes:
  # Created only by the `stems` profile — the default MVP `up` never starts the worker that uses it.
  worker-cache:
