# Encore — one container for the MVP. The worker is gated behind the `stems` profile,
# so `docker compose up` runs ONLY core until you opt into stem-separation.
#   MVP:        docker compose up
#   With stems: docker compose --profile stems up
# Container hardening (Finding #4): no-new-privileges + cap_drop ALL on every service. The app
# is a plain HTTP/WS server that needs no Linux capabilities; dropping them shrinks the blast
# radius of any RCE. Runs as non-root `bun` (see Dockerfile USER).
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  core:
    <<: *hardening
    build:
      context: . # repo root — the Dockerfile copies packages/shared + apps/core
      dockerfile: apps/core/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MEDIA_STORE=local
      # B-7 storage classes, split by REPLACEABILITY (docs/media-storage-spec.md §3). Each defaults
      # under MEDIA_DIR, so these lines are documentation as much as configuration — point any one at
      # its own volume to separate the disks (audio on the big one, derived on the fast one).
      - MEDIA_DIR=/app/media
      - ENCORE_AUDIO_DIR=/app/media/audio # raw originals — NOT regenerable; this is what to back up
      - ENCORE_DERIVED_DIR=/app/media/derived # stems/pitch/lyrics/thumbs — safe to delete, recomputable
      - ENCORE_META_DIR=/app/media/meta # sidecar records — the authoritative library
    volumes:
      # Host paths are overridable from a .env so the volumes can move without editing this file.
      - ${ENCORE_DATA_VOLUME:-./data}:/app/data # sqlite (WAL)
      - ${ENCORE_MEDIA_VOLUME:-./media}:/app/media # audio + derived + meta + job scratch
    restart: unless-stopped

  worker:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    profiles: ["stems"] # not started in the default MVP up
    environment:
      - ENCORE_CORE_WS=ws://core:3000/ws?role=worker
      - ENCORE_WORKER_CONCURRENCY=1
      # `align` gives the worker the word-timed-lyrics pipeline as well as stems (B-3).
      - ENCORE_WORKER_CAPABILITIES=${ENCORE_WORKER_CAPABILITIES:-stems}
    volumes:
      # Shares the local MediaStore volume (single-box mode). The worker writes raw audio into
      # audio/ and stems into derived/ using the SAME keys the core resolves — see
      # apps/worker/src/processor.py, which must stay byte-for-byte in step with core paths.ts.
      - ${ENCORE_MEDIA_VOLUME:-./media}:/app/media
    depends_on:
      - core
    restart: unless-stopped
    # deploy.resources.reservations.devices for GPU added when stems land
