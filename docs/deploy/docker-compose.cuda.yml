# NVIDIA GPU worker — compose OVERRIDE for the repo-root docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docs/deploy/docker-compose.cuda.yml \
#     --profile stems up -d
#
# Current deploy target: Windows x86_64 + WSL2 + RTX 3080 (10 GB). Full runbook, including the WSL
# networking that breaks first, is docs/DEPLOY-WSL2.md — read that before running this.
#
# An override rather than a second full compose file: core's definition, the hardening anchor and the
# volume wiring all keep coming from the base file, so a change there reaches this deployment too
# instead of rotting in a fork.
#
# Deliberately NOT set here:
#   * ENCORE_DATA_VOLUME / ENCORE_MEDIA_VOLUME — a property of the host's disks, not its GPU. Put them
#     in a .env beside the root compose file. On WSL2 they MUST point at the distro's own ext4 and
#     never at /mnt/c: 9p is slow and does not honour POSIX locking, and core runs SQLite in WAL mode.
#   * worker-cache — already a NAMED volume in the base file, for a reason documented there. Do not
#     convert it to a bind mount; Docker initialises a named volume from the image's own
#     $XDG_CACHE_HOME, so it inherits the worker's ownership, whereas a fresh bind directory arrives
#     root-owned and the uid-10001 worker cannot write to it.

services:
  worker:
    build:
      args:
        # The whole CUDA change. cu128 carries the exact versions requirements.txt already pins
        # (torch 2.8.0, torchaudio 2.8.0, torchvision 0.23.0), so there is no requirements edit and no
        # custom Dockerfile — the base one already takes this arg. torch's wheels bundle the CUDA
        # runtime as nvidia-* packages, so no CUDA base image is needed either.
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu128

    environment:
      # EXPLICIT, not auto-detected. backends.py REFUSES a device it cannot reach, so naming cuda here
      # turns a driver or passthrough mistake into a loud startup failure instead of a silent CPU cook
      # that merely takes 20x longer and looks like a slow box.
      - ENCORE_DEMUCS_DEVICE=cuda
      # WhisperX rides faster-whisper/CTranslate2, which is CUDA-native — word-timed lyrics and the
      # ASR fallback get the same speedup as separation, not just stems.
      - ENCORE_WHISPERX_DEVICE=cuda
      # A GPU box is the right place to own the whole pipeline. `fetch:ytdlp` matters: acquisition
      # routes on its own capability, so with no fetch-capable worker connected every new song sits at
      # 0% forever while the core waits for something to run the fetch job it enqueued.
      - ENCORE_WORKER_CAPABILITIES=stems,align,score,fetch:ytdlp
      # Start at one. On a GPU this contends for VRAM rather than CPU cores, and overcommitting fails
      # as a CUDA OOM mid-cook rather than as graceful slowdown. 10 GB is comfortable for one
      # separation but not for a separation plus WhisperX large-v3 at the same time. Raise it only
      # after watching nvidia-smi through a real cook.
      - ENCORE_WORKER_CONCURRENCY=1
      # ENCORE_DEMUCS_JOBS and ENCORE_TORCH_THREADS are intentionally left unset. Both derive from
      # os.cpu_count() (config.py auto_demucs_jobs / auto_torch_threads) and describe CPU parallelism,
      # which is not what limits a GPU cook. The worker may still print a CPU-derived value on
      # startup — that line is informational, not a claim about the GPU.

    deploy:
      resources:
        reservations:
          devices:
            # Honoured by `docker compose up` — unlike most other `deploy` keys, which are Swarm-only.
            # `gpus: all` is the newer shorthand if you prefer it.
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # ── escape hatch, deliberately left commented ────────────────────────────────────────────────
    # The base file drops ALL Linux capabilities and sets no-new-privileges on every service. CUDA
    # needs device nodes rather than capabilities, so this SHOULD be compatible — but it is unverified
    # on this stack. If `docker run --gpus all ... nvidia-smi` works standalone while the GPU is
    # invisible inside the worker, uncomment this to confirm the hardening is the cause before changing
    # anything else, then put it back.
    # security_opt: []
    # cap_drop: []
