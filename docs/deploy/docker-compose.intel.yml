# Intel Arc GPU worker — compose OVERRIDE for the repo-root docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docs/deploy/docker-compose.intel.yml \
#     --profile stems up -d
#
# PARKED. The deploy target moved to NVIDIA (see docker-compose.cuda.yml). Kept because the Arc box
# may come back, and because the selection logic in worker/src/host/backends.py already models `xpu`
# as a torch DEVICE rather than a separate backend — so this path needs no separator code, only wheels
# and device passthrough.
#
# NOTE this uses the BASE Dockerfile. Intel Arc originally needed intel-extension-for-pytorch as an
# extra install whose version had to be matched to both the host driver and the pinned torch; that is
# no longer true. PyTorch ships native torch.xpu upstream and the xpu index carries the exact versions
# requirements.txt pins (torch 2.8.0, torchaudio 2.8.0, torchvision 0.23.0), so the ordinary image plus
# an index swap is enough. The old IPEX-based Dockerfile.intel has been DELETED; backends.py still
# imports IPEX before torch when it is installed, so that path survives as belt-and-braces. Recover the
# file from git history if a specific driver pairing ever turns out to need it.
#
# UNVERIFIED: no Arc hardware was ever available to run this. Every line below is reasoned from the
# repo and Intel's documentation, not measured.

services:
  worker:
    # PID-1 zombie reaping — see the note in the base docker-compose.yml. Restated
    # here because a reader of this override should not have to know Compose merge rules to see it.
    init: true
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/xpu

    # No `environment:` block. The device, the alignment device, the capability list and the
    # concurrency are all measured by the worker now: it probes for xpu (importing
    # intel_extension_for_pytorch before torch where present, since that import is what registers the
    # backend — belt-and-braces with native torch.xpu) and advertises only what it can prove.
    #
    # Set ENCORE_DEVICE=xpu in a .env if you want a passthrough or driver mistake to fail LOUDLY at
    # startup rather than falling back to CPU. On this workload that is the difference between minutes
    # and most of an hour, so it is worth considering — but it is a deployer's call, not a fact of the
    # hardware, which is why it no longer lives here.

    devices:
      # What actually makes the GPU visible. Without it torch.xpu.is_available() is false and the worker
      # cooks on the CPU — or fails loudly at startup if you set ENCORE_DEVICE=xpu, which is the point
      # of setting it.
      - /dev/dri:/dev/dri

    # The render/video group IDs differ between distributions, so these are NUMERIC and host-specific:
    # check `getent group render video` on the host and correct them. Names are not portable here, and
    # the base file runs the worker as non-root uid 10001, which must be in the render group to open
    # the device nodes.
    group_add:
      - "44"  # video  — verify on the host
      - "993" # render — verify on the host; commonly 993 or 109

    # Sizing note if this box returns: an A310 has 4 GB of VRAM and 124 GB/s, an A380 6 GB and
    # 186 GB/s. The 11-second-window RoFormer checkpoints (485100 samples) are the ones that will
    # strain 4 GB — expect to need a reduced segment size, and expect a CUDA-style OOM rather than a
    # graceful downgrade. Both cards are also BELOW the aarch64 dev box on memory bandwidth (~300 GB/s),
    # and this workload measured memory-bound, so do not assume a speedup: measure it.
    #   docs/benchmarks/scripts/checkpoint_cost.py
