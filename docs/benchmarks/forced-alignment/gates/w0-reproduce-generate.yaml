# ── REBASED 2026-09-30 BY W4b (spec (c)) ────────────────────────────────────────────────────────────────
# REBASED FROM: the review's raw-decode figures (blind Jamendo words ±100 78.7, ±250 90.5, ±300 91.3, bias
#   +4 ms, 141/5693 > 2 s; ends 73.2 / phrase-final 40.6 / 73.6 / -106 ms, painted highlight 67.3), measured by
#   `bench.py --global --words` and `_review-scratch/pe-acc/exp_ends.py` on the pre-W4 clock. The provenance of
#   each of those numbers — including which matrices the review's own were computed on, and that the shipped
#   decoder reads the review's figures exactly on them — is kept in README's "The E2E harness".
# REBASED ONTO: `results/w4-generate.json` (`--level generate --modes blind --songs jamendo`, 20 songs, base
#   model, the W4 clock; the run's rows are `_runs/w4-generate/rows.jsonl`).
# WHY: `--level generate` IS the decode, so W4's 6a moved every number here by construction — the exact
#   320-sample grid, `frame_sec = 0.02` exactly, 2 s of trimmed context per side, and `ONSET_LEAD_SEC`
#   40 -> 30 ms re-fitted on it. A gate that fails by construction teaches a later wave to ignore it.
#   READ ON THE W4 ROWS THE OLD LITERALS SCORED 3/11, AND THE 8 FAILURES SPLIT 3 GAINS / 5 REGRESSIONS
#   (W4b review r1 — this header called all eight "the gain", which hid a 4.5 pt drop in the raw decode's
#   word ends; reproduced offline with `e2e.py --summarize _runs/w4-generate/rows.jsonl --gates <the old
#   file>`):
#     THE 3 GAINS, all ONSETS: ±100 78.7 -> 79.98, |bias| 4 -> 3.1 ms (+4 -> -3.1: the sign flipped and the
#       magnitude fell), words more than 2 s out 141 -> 129. (±250 and ±300 are the two that still PASS
#       inside the 0.5 pt tolerance: 90.5 -> 90.46, 91.3 -> 91.45.)
#     THE 5 REGRESSIONS, all ENDS and the highlight the ends paint: word end ±100 73.2 -> 68.74 (**-4.46
#       pt**), phrase-final end ±100 40.6 -> 36.3 (-4.30), ±250 73.6 -> 72.74 (-0.86), phrase-final end bias
#       -106 -> -120.8 ms (14.8 ms LATER), painted highlight 67.3 -> 66.0 (-1.30).
#     WHY THAT IS NOT A CONTRADICTION, and why the wave shipped anyway: these five are PRE-`extend_ends`.
#       `--level generate` stops before the word-end post-pass (W4 item 5 applies it in `time_text`, just
#       before `as_doc`), so the exact clock left the RAW decode's ends worse while the post-pass that reads
#       them more than repays it — `gates/w4-ends.yaml` is the ends' own row (6/6 at `--level time_text`,
#       blind): from exactly these numbers, phrase-final end ±100 36.3 -> 56.8 (+20.5) and highlight
#       65.9 -> 77.5 (+11.6). This file measures the DECODE; it is not the file that says whether a published
#       end is good.
# WHAT IT NOW MEANS: the raw decode's DETERMINISM — same corpus, same model, same emissions key, same numbers.
#   It is the file that fails if the emission pass, the frame grid or the onset lead moves again without a
#   wave saying so. The ends and highlight lines still read the PRE-post-pass numbers, because `--level
#   generate` stops before `extend_ends` (W4 item 5 applies it in `time_text`, just before `as_doc`); the
#   post-pass's own gate is `gates/w4-ends.yaml`.
#
#   cd worker && .venv/bin/python ../docs/benchmarks/forced-alignment/scripts/e2e.py --level generate \
#       --modes blind --songs jamendo \
#       --gates ../docs/benchmarks/forced-alignment/gates/w0-reproduce-generate.yaml
#   (offline, no decode: e2e.py --summarize <run>/rows.jsonl --gates ...)
#
# Tolerances are unchanged (0.5 pt; ±2 ms onset bias, ±5 ms end bias — a median moves in whole frames' worth).
words-pm100: abs(blind.jamendo.word_pm100 - 79.98) <= 0.5
words-pm250: abs(blind.jamendo.word_pm250 - 90.46) <= 0.5
words-pm300: abs(blind.jamendo.word_pm300 - 91.45) <= 0.5
words-bias: abs(blind.jamendo.word_bias_ms + 3.1) <= 2
words-gross: abs(blind.jamendo.word_gross - 129) <= 0.5
end-pm100: abs(blind.jamendo.end_pm100 - 68.74) <= 0.5
final-end-pm100: abs(blind.jamendo.final_end_pm100 - 36.3) <= 0.5
final-end-pm250: abs(blind.jamendo.final_end_pm250 - 72.74) <= 0.5
final-end-bias: abs(blind.jamendo.final_end_bias_ms + 120.8) <= 5
highlight: abs(blind.jamendo.highlight - 66.0) <= 0.5
