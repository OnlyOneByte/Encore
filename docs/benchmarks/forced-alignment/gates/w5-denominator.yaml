# W5's DENOMINATOR GATE: does a song's SCORED line count still move when only the acoustic bundle changes?
# (PLAN-alignment-v3 W5, "THE CAPTION-CUE DENOMINATOR ARTEFACT"; found by W6's diagnose task, assigned to
# W5's text-hygiene item by the orchestrator's 2026-10-01 scope row.)
#
# WHY IT HAS ITS OWN FILE AND ITS OWN BASE. Every other W5 gate asks "what did this wave do to the shipped
# default?" and takes a W6 row as the base. This one asks the opposite question — "are two BUNDLES comparable
# per song?" — so its base must be the BASE BUNDLE MEASURED ON THE SAME TREE, or the reading mixes the
# hygiene into the model difference and answers neither question. That is why `results/w5-base-run_align.json`
# exists: 1088 cases, `--model WAV2VEC2_ASR_BASE_960H`, same code, same seed, same corpus, same emitter.
#
#   cd worker && .venv/bin/python ../docs/benchmarks/forced-alignment/scripts/e2e.py \
#       --level run_align --modes all,wrongtext+ownclock \
#       --compare ../docs/benchmarks/forced-alignment/results/w5-base-run_align.json \
#       --gates ../docs/benchmarks/forced-alignment/gates/w5-denominator.yaml
#
# IT IS READ AT `run_align` ONLY. At `--level time_text` the harness sends the claims in RAW
# (`e2e.TimeTextDriver`: "the shipped `time_text` cleans nothing itself"), so the 34 non-lyric caption lines
# are still in the text there and the artefact cannot close — measured 91 song-modes differing at `time_text`
# on the W6 tree and 91 on this one. The fix is a TEXT fix; it lands where texts are served.
#
# ── WHERE IT STANDS: NARROWED, NOT CLOSED, AND THE REMAINDER IS NAMED ────────────────────────────────────
# W6 tree (`results/w6-base-run_align.json` against `results/w6-hubert-run_align.json`): 9 songs,
#   100 song-modes.
# THIS tree: **7 songs, 86 song-modes**. Closed outright — `hello` (12 song-modes), `bohemian-rhapsody` (12),
#   `shape-of-you` (4), `rap-god` (1): the caption-cue half, which is what the orchestrator's row named
#   ("hello 73 -> 72", "tfr-chosen 34 -> 33 ... part of it is the caption-cue DENOMINATOR artefact").
# THE REMAINING 86 ARE NOT A TEXT PROBLEM, and the proof is in the rows: `served_lines` is IDENTICAL between
#   the two bundles in ALL 1088 cases, so nothing text-side can still differ per model. What is left is
#   ACOUSTIC by construction — the never-sung envelope rule (W1 M6, W4's floor) and `_fitted_run`'s
#   frame-per-letter refusal — and it goes BOTH ways, which is what a sharper decode does at a floor:
#     Pure_Mids_-_The_Leader   19 -> 20   HuBERT-L hears a line the base bins
#     Ridgway_-_Fire_Inside    49 -> 50
#     never-be-alone           44 -> 46
#     feel-my-heart            31 -> 32
#     Color_Out_-_Falling_Star 37 -> 36   HuBERT-L bins a line the base keeps
#     bad-guy                  65 -> 64
#     tfr-chosen               34 -> 32
#   Four of those seven carry NO caption cue at all, which is the cleanest evidence that the text fix had
#   nothing left to do for them. `tfr-chosen`'s gap WIDENS from 1 to 2 for a specific reason worth keeping:
#   the base bundle's single drop there WAS the cue, so removing it from the text leaves HuBERT-L's two
#   ordinary-lyric drops standing alone. A cross-model per-song ±500 row is therefore honest for the 25 songs
#   held at 0 below, and for the other 7 it must still be read with the never-sung rule named.
#
# WHAT WOULD CLOSE IT COMPLETELY (not taken here, and it is not a text change): make the never-sung decision
# model-independent — bin on the MIX envelope, which does not change with the alignment bundle, or require
# both bundles' agreement. `m6-mix-spare` and `m6-window-spare` are the two arms already built for that
# question (PLAN W1), and `m6-window-spare` is still owed a `run_align` read.
#
# Gates are the CONDITION THAT MUST HOLD (the negation of the reject-if); see e2e_gates.py for the language.

# ── MUST: the cue half stays closed, in every mode ────────────────────────────────────────────────────────
# 7 is the measured count of songs whose scored line count still differs, and it is the SAME 7 in every
# timed claim mode. Writing the bound at 7 rather than 0 is the honest form: an EIGHTH song appearing is a
# regression this file catches, and the seven are enumerated above with their cause. The drop modes have
# their own counts because a refusal removes a song from the comparison.
denominator-truth-at-most-seven-songs: count(truth.song.scored_up) + count(truth.song.scored_down) <= 7
denominator-jit-at-most-seven-songs: count(mode("jit").song.scored_up) + count(mode("jit").song.scored_down) <= 7
denominator-off15-at-most-seven-songs: count(off15.song.scored_up) + count(off15.song.scored_down) <= 7
denominator-tempo098-at-most-seven-songs: count(tempo098.song.scored_up) + count(tempo098.song.scored_down) <= 7
denominator-blind-at-most-seven-songs: count(blind.song.scored_up) + count(blind.song.scored_down) <= 7
denominator-headers-at-most-seven-songs: count(headers.song.scored_up) + count(headers.song.scored_down) <= 7
denominator-credit-at-most-six-songs: count(credit.song.scored_up) + count(credit.song.scored_down) <= 6
denominator-extraverse-at-most-five-songs: count(extraverse.song.scored_up) + count(extraverse.song.scored_down) <= 5
# AND IT FAILS AT 6 SINCE W5 REVIEW ROUND 2, MEASURED, WITH THE EIGHTH SONG NAMED — the one thing this file
# exists to catch, caught (bench runner, 2026-10-01, `results/w5r2-run_align.json` against
# `results/w5r2-base-run_align.json`). `extraverse` was sitting EXACTLY on its bound (5 <= 5 on the round-1
# pair, `results/w5-run_align.json` against `results/w5-base-run_align.json`, re-read offline on this very
# file), and round 2's `nonlyric.NOTED_SHARE` 0.5 -> 0.8 spent that last slack: `hello` `extraverse` is the
# ONE served text in all 1088 cases the raise moves (63 -> 80 lines, because the mode's donor verse puts the
# noted share at 63/80 = 0.7875, inside the band R3 now abstains in), and the two bundles then disagree about
# 2 of the 17 restored lines — `hello` `extraverse` scored **72 under the base bundle and 74 under HuBERT-L**.
# THE CAUSE IS THE SAME ACOUSTIC REMAINDER THE HEADER ALREADY NAMES, not a new text asymmetry: `served_lines`
# is still IDENTICAL between the bundles in all 1088 cases, so what differs is which of those lines a bundle
# TIMES (the never-sung envelope rule and `_fitted_run`'s frame-per-letter refusal). The population is 8 songs
# / 87 song-modes now against 7 / 86: the same seven, plus `hello` in `extraverse` ALONE (1 song-mode, not 12,
# because `hello`'s own text still fires R3 at 63/74 = 0.8514 and only the donor-verse mode dilutes it).
# THE BOUND IS NOT WIDENED — only the owner waives a reject-if, and a fix agent moving the literal is the
# silent default-on the PLAN's hard rules forbid. Both are here, on `gates/w5.yaml`'s `-plan-bar` /
# `-itemised-cost` precedent: the stated bar FAILS and is recorded, and the clause below is the ceiling of the
# ONE named cause, so a NINTH song still trips a second gate instead of hiding inside a widened bound.
# WHAT WOULD CLOSE IT: the same mix-envelope / two-bundle-agreement change the header names for the other
# seven (`m6-mix-spare` / `m6-window-spare`) — `hello` `extraverse` is not a different defect, it is one more
# song-mode reaching the one that was already open.
denominator-extraverse-itemised-at-most-six-songs: count(extraverse.song.scored_up) + count(extraverse.song.scored_down) <= 6
denominator-drop20-at-most-four-songs: count(drop20.song.scored_up) + count(drop20.song.scored_down) <= 4
denominator-drop50-at-most-six-songs: count(drop50.song.scored_up) + count(drop50.song.scored_down) <= 6
# POOLED, the per-song differences very nearly cancel, which is exactly why the per-song count above is the
# gate and a pooled one would have hidden the artefact: truth 1707 against the base bundle's 1706.
denominator-pooled-scored-within-four: truth.scored <= base.truth.scored + 4
denominator-pooled-scored-within-four-down: truth.scored >= base.truth.scored - 4
# `in_text` IS A HARNESS INVARIANT AND NOT THE FIX'S EVIDENCE — labelled as the tautology it is rather than
# left standing in for a claim it cannot carry (W5 review r2-spec-11). It is the TRUTH text's line count
# (`e2e_lib.row_of`: `len(claims.truth_indexes())`), computed before the worker is called and from a file no
# bundle and no hygiene touches, so it reads [1760 == 1760] on the shipped pair AND on the pre-fix W6 pair —
# one of the 7 that already passed in the 7/15 reading below. What it DOES prove is worth one gate: both runs
# scored against the same denominator, so every difference under it is the worker's.
denominator-in-text-equal: truth.in_text == base.truth.in_text
# THE CLAIM THE FIX MAKES — the two bundles are SERVED the same lines — is read per case and not here, because
# `served_lines` is a per-case field (`e2e_lib.COMPACT_KEEP`) that the summary does not aggregate. Measured on
# the committed digests, no decode: all 1088 cases of `results/w5-run_align.cases.jsonl` carry the same
# `served_lines` as `results/w5-base-run_align.cases.jsonl`, and the 86 that differ differ in `scored` alone
#   python3 -c "import json;r=lambda p:{(x['song'],x['mode'],x.get('variant'),x.get('donor')):x for x in map(json.loads,open(p))};
#   a=r('results/w5-run_align.cases.jsonl');b=r('results/w5-base-run_align.cases.jsonl');
#   print(sum(a[k]['served_lines']!=b[k]['served_lines'] for k in a), sum(a[k]['scored']!=b[k]['scored'] for k in a))"
# -> `0 86`. Making that a GATE means summarising `served_lines` into the run document beside `scored` and
# `in_text` (pooled and per song) — a harness change and a re-summarise of every committed row, which is the
# bench runner's to take, not this file's.
# WHAT IS READABLE HERE ABOUT THE ACOUSTIC HALF: `unsung` — the never-sung rule's own count — is **0 on both
# sides** of every pair above, so none of the 86 differences is a line the document declined as silent; each
# is a line it did not TIME (`_fitted_run`'s frame-per-letter refusal). Slack today and one-directional, like
# `gates/w5-flip.yaml` section 3: it bites the moment that stops being true.
denominator-unsung-equal: truth.unsung == base.truth.unsung
denominator-missing-within-four: truth.missing <= base.truth.missing + 4

# ── NON-VACUITY ───────────────────────────────────────────────────────────────────────────────────────────
# 16 gates plus the built-in no-ERROR-rows (15 before the `-itemised-at-most-six-songs` companion above).
# ROUND 1: **16/16** on `results/w5-run_align.json` against `results/w5-base-run_align.json` (15/15 before
# W5 review r2-spec-11 added the `unsung` clause and relabelled the `in_text` one), with `extraverse` at
# exactly 5 <= 5.
# ROUND 2, every case re-measured (bench runner, 2026-10-01, code `e2c1027b6cc491a2`): **16/17** on
# `results/w5r2-run_align.json` against `results/w5r2-base-run_align.json` — `extraverse` 6 against the
# stated bound of 5 FAILS and the companion at 6 passes; see that clause for `hello`'s name and cause. Read
# with the pair reversed it is also 16/17, because this file's question is symmetric (a count of differences),
# which is the one gate family here that SHOULD read the same both ways.
# Read on the W6 TREE's own pair (`results/w6-hubert-run_align.json`
# against `results/w6-base-run_align.json`) it reads **9/17** (8/16 before the companion clause, which passes
# there at 6 <= 6), and the EIGHT failures are the artefact
# itself: `truth` / `jit` / `off15` / `tempo098` / `blind` 8 against the bound of 7, `credit` 8 against 6,
# `extraverse` 6 against 5, `drop20` 7 against 4. (`headers` 5 and `drop50` 2 are slack there, because the
# injected-header text and the 50% drop already moved those denominators for other reasons.) So this file
# tells the two trees apart, which is what makes the 7 a measurement and not a description.
# AND IN `--sync-mode lines` THE ARTEFACT IS STILL ABSENT, re-measured on the round-2 pair
# (`results/w5r2-lines-run_align.cases.jsonl` against `results/w5r2-base-lines-run_align.cases.jsonl`):
# `served_lines` differs in 0 of 1088 cases and all 22 `scored` differences are `0 -> N` or `N -> 0`, i.e. a
# document that exists on one side only — never a different line COUNT on a committed pair. `hello`
# `extraverse` does NOT appear there: in `lines` mode that document is the claim sheet's own line spans, so
# the two bundles write byte-identical documents (`doc_sha256` `a56c61c9d3c6846d` on both) at scored 74.
