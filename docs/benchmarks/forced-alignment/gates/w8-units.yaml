# W8 STAGES 1-2: script-aware units, and MMS_FA over romanised text (PLAN-alignment-v3 W8, review §3 item
# 12). Narrative and every number: LOG.md, "W8 stages 1-2: script-aware units, and MMS_FA over romanised
# text".
#
#   cd worker && ENCORE_ALIGN_EXPERIMENTS=nonlatin-units .venv/bin/python \
#       ../docs/benchmarks/forced-alignment/scripts/e2e.py \
#       --level generate --corpus nonlatin --language zh --songs amll-zh --modes truth \
#       --tag w8s12-zh-units \
#       --gates ../docs/benchmarks/forced-alignment/gates/w8-units.yaml
#
# ONE LANGUAGE A RUN (`--language` takes one), so this file is evaluated once per language and §1 holds for
# each. `--songs amll-<language>` is not optional: without it `discover` returns all 7 AMLL songs and the
# other languages' would be decoded on this bundle under this language's unit rules (review r1-tests-18 —
# e2e.py now refuses the combination rather than measuring it). The `generate` level is deliberate: §5.4
# declines a WORD document off a bundle with no `lexical.CALIBRATED` row, and when these cells were measured
# neither the per-language whisperx bundles nor MMS_FA had one — so the raw decode was the only place a
# syllable could be scored at all. W10 fitted zh and ja, so a `run_align` reading is now possible for those
# two; this file stays at `generate` because that is the level its floors below were read on, and the raw
# decode is still the only reading ko and every unfitted language has.
#
# THERE IS NO `--compare` BASELINE: `corpus` is setup (`e2e_gates.SETUP_META`), so every recorded English row
# is a mismatch here rather than a comparison. The floors below are §3.12's reject-if and the one-song
# readings of 2026-10-15 (`_runs/w8s12-*`), rounded DOWN so a corpus run has room to be a little worse.
#
# Gates are the CONDITION THAT MUST HOLD (the negation of the reject-if); see e2e_gates.py.

# ── 1) MUST: §3.12's reject-if — AMLL zh/ja syllable ±300 at or above 70% ──────────────────────────────
# The review fails these stages below 70%. The whitespace rule reads 16.80 (zh) and 11.54 (ja) on the same
# songs, because it publishes one word for a whole line and every syllable of that line is scored against
# its single onset.
#
# ON THE TRUTH'S DENOMINATOR (`syllable_pco300`), which is review r1-spec-8: `syllable_pm300` divides by the
# units that were ALIGNED, so it RISES as coverage falls, and the two read 8 points apart on the ko cell
# (80.67 against 72.52, 481 aligned of 535 asked for). The reject-if gets the denominator that cannot be
# flattered; `syllable_pm250` stays below it as the precision of the units that did align.
syllable-pco300-not-below-seventy: truth.syllable_pco300 >= 70.0
syllable-pm250-not-below-seventy: truth.syllable_pm250 >= 70.0

# ── 2) MUST: every truth syllable is accounted for ────────────────────────────────────────────────────
# `syllable_unpaired` is a truth span no published unit covers. It exists so an unpairable span cannot
# quietly leave the denominator, and it must stay a rounding error rather than a population: 1 of 693 on
# `amll-ja-yoru-ni-kakeru`, 0 everywhere else read so far.
syllables-are-paired: truth.syllable_unpaired <= 0.02 * truth.syllable_in_text
syllables-have-a-truth: truth.syllable_in_text >= 400
# AND THE FOUR BUCKETS SUM TO THE DENOMINATOR (r1-spec-8). Before `syllable_unpublished` existed, a truth
# syllable on a line the document never carried was in NO bucket: the ko cell read 481 + 30 + 0 against
# 535, leaving 24 spans — 7 of its 55 lines — unremarked by every gate here. `unpublished` is a COVERAGE
# reading and is bounded on its own.
#
# ANSWERED BY A RUN, not by re-gating: a row written before the bucket existed carries no
# `syllable_unpublished` and reads 0 for it, so the identity FAILED on the 2026-10-15 rows by construction.
# All 10 cells were therefore RE-RUN on 2026-10-15 (`results/w8r1-*-generate.json`, `_runs/w8r1-*`), and the
# identity holds on every one. Only ko has a non-zero reading — 24 of 535, 4.49%, both ko arms — which is
# what the ko document costs today; zh and ja read 0. LOG.md, "W8 stages 1-2".
syllables-account-for-every-truth-span: truth.syllable_aligned + truth.syllable_interpolated + truth.syllable_unpaired + truth.syllable_unpublished == truth.syllable_in_text
syllables-mostly-on-published-lines: truth.syllable_unpublished <= 0.06 * truth.syllable_in_text

# ── 3) MUST: the units did not cost the lane its lines ────────────────────────────────────────────────
# A GROUPING change may not move a line: the target sequence is the same characters in the same order under
# `nonlatin-units` alone, so the line figures must read what the whitespace rule read (zh 96.77 / ja 96.43
# on the songs above). A floor rather than an equality, `--language` making the pool a different one.
#
# RESTATED IN W10, AND THE RESTATEMENT IS THE HONEST READING (W8 close-out, OPEN (b)). At 75.0 this floor
# passed ko by EXACT EQUALITY: `amll-ko-gangnam-style` reads 36 of 48 scored lines within +-500 ms = 75.00,
# on a ONE-SONG pool, so one line moving would have failed a gate ko is not even in SS3.12's reject-if for
# (it names zh and ja). The owner was offered either a second Korean song or an honest restatement; the
# evidence picks the restatement: the AMLL set holds exactly ONE Korean candidate, and `amll/_rejected/`
# holds thirteen dropped on measurement with NOT ONE of them Korean, so there is no second ko song on this
# box to admit and a new one needs audio this tree does not and cannot hold. 72.0 is one lost line of
# stated head-room (35/48 = 72.92 passes, 34/48 = 70.83 fails) instead of zero implied. Every other cell
# clears it by 15 points or more (zh 97.47 / 96.46, ja 87.36 on all three arms, ko 85.45 under `mms-roman`).
# LOG.md, "W10: the ko floor, restated as the one-song reading it is".
lines-not-lost: truth.pm500 >= 72.0
lines-published: truth.published + truth.line_sync == truth.cases

# ── 4) MUST: the gross population is a tenth of what the whitespace rule left ─────────────────────────
# 151 -> 1 (zh) and 220 -> 2 (ja) syllables more than 2 s from their truth. A share rather than a count, so
# a run over more songs can hold it.
syllable-gross-share: truth.syllable_gross <= 0.05 * truth.syllable_in_text
