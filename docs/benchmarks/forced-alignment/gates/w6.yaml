#   (2) THE TREE THIS WAVE REPLACES, `_runs/w4b-base-time_text/rows.jsonl` against its own summary — so every
#       relative gate reads `=` against itself, which a ratchet must: **29/33**, the same four, at W4b's own
#       digits (83.25 / 87.8 / 77.1 / gross 3). Section 1's absolutes were set from that row and read at their
#       own literals there, so THIS FILE IS NOT WHERE THE CLAMP FIX IS PROVEN — `gates/w6-ladder.yaml` is
#       (28/31 on that row, failing exactly the three line-start claims the fix makes). What this row shows is
#       that the file still tells the two trees apart where it claims to: `flip-jamendo-truth-gross-zero` reads
#       3 there and 1 here, `w6-jamendo-word-pm100` 83.25 and 83.52.
#   (3) THE CANDIDATE, `_runs/w6-ladder-hubert/rows.jsonl` against `results/w6-base-time_text.json`:
#       **32/33** — all four of section 3 PASS (85.46 / 71.1 / 81.40 / gross 0), every per-mode gross gate
#       passes (truth 0 <= 1, jit 0 <= 31, credit 0 <= 23, drop50 167 <= 303, blind 68 <= 106), and the ONE
