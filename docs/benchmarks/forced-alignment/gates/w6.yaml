# W6's WAVE-LEVEL reject-if: what the whole wave (confidence + bounded clamp) may not cost the SHIPPED
# default, what wrong-text protection must still read at every level, and the four conditions W4b's flip had
# to meet to become the default. Written 2026-09-30 by the bench runner, off the corpus sweeps below, and
# RE-READ unchanged on the round-2 re-run of all eight of them (same date, code `622288017e9d268a`).
#
# ── W5 TOOK THE FLIP (2026-10-01), SO READ THIS FILE WITH TWO CORRECTIONS ─────────────────────────────────
#   * "the shipped default" below means the BASE BUNDLE, which is what it was when this file was written.
#     Section 1's and 2's literals are that bundle's, so HuBERT-L clears them with room and they no longer
#     ratchet the bundle that ships: `gates/w5-flip.yaml` is the file that does, with every bar set where only
#     the new default can reach it, and it is the one to run from W5 on.
#   * SECTION 3 IS NO LONGER "THE CANDIDATE's BAR" — those four absolutes are now the DEFAULT's, and a
#     `--model`-less run reads 85.46 / 71.1 / 81.40 / gross 0 and PASSES all four. The one FAIL left on the
#     new default, `w6-no-song-gains-gross` at 8 song-modes (6 at `run_align`), is the gate the orchestrator
#     OVERRULED when taking the flip — every one of those song-modes is in drop20 / drop50 / blind, none in a
#     timed claim mode, against 268 gross lines removed corpus-wide. `gates/w5-flip.yaml` section 3 re-states
#     it as the two claims actually held (ZERO in the thirteen claim modes, at most 8 in the degraded ones) so
#     the waiver is a bound rather than a permanently-failing MUST. Nothing in this file was re-priced.
#
# THE WAVE'S OTHER TWO GATE FILES OWN THEIR OWN HALVES and are NOT duplicated here:
#   * `gates/w6-conf.yaml`  — the per-line confidence rule's reject-if (review §3.7): bad-among-high halved
#     where the rule decides, `high_gross` zero in every claim mode, onsets unchanged. Read on
#     `results/w6-base-time_text.json` against `results/w6-legacy-time_text.json` (the `conf-legacy` control
#     arm on the SAME tree): **29/29**. Its blind `high_gross` gate was an absolute zero reading 3 and was
#     restated as the two claims actually held (review r1-spec-13): ZERO on Jamendo, where §3.7's reject-if
#     is written and the rule takes 23 -> 0, and a BOUND OF THREE pooled, those three being caption-truth
#     lines on `hello` (1) and `rap-god` (2) — named so a fourth reads as a regression. See section 1's note.
#   * `gates/w6-ladder.yaml` — the clamp's bounded left floor. Read on the shipped default at BOTH levels
#     against `results/w4b-base-{time_text,run_align}.json`: **31/31 each**. Its blind-unchanged MUST reads
#     the ONSET digest, not the document bytes (review r1-spec-11): the bytes check could not hold against a
#     pre-W6 control at all, because this wave's confidence item rewrites the `confidence` field on 160 of
#     866 blind Jamendo lines, so it recorded a FAIL at 30 for a timing that never moved.
#   * `gates/w4b.yaml` IS the flip's acceptance test and stays the flip's acceptance test. Read on
#     `results/w6-hubert-time_text.json` against `results/w6-base-time_text.json`: **28/30**. Section 3 here
#     holds only the four ABSOLUTE wins the brief named, which no relative file can state.
#
# HOW TO RUN IT (eight sweeps, RE-RUN 2026-09-30 after review round 2, 32 songs, seed 0, wrong_k 10,
# `--tfr-audio youtube`, code `622288017e9d268a` = `tree_digest([encore_worker])` 79b561800ecb8e0c |
# `harness_digest()` 659fd1f6059f44df; every literal below is READ off them, none projected, and every
# `results/w6-*` file carries that one fingerprint in `meta.code` with its gate readings in `meta.gates`.
# The tree then moved once more, to 9d6233c39ac80716 | 659fd1f6059f44df -> 73b3ddad4309aaa2, and the delta is
# the `generate.trimmed` docstring recording this re-read: comment bytes, outside the emission closure.)
# THE ROUND-1 SWEEPS WERE `cad1ca7d2eaf2cf5` (commit `1c81d89f`'s tree) and every literal in this file read
# the same on them: the round-2 fixes moved 21 of 1088 `time_text` cases on the base bundle and 13 on
# HuBERT-L, all of them the clamp's tail floor (review r2-spec-9), and not one pooled number this file
# gates. (The header's own prediction of the current tree, 5b6d359e7198ef1c | 874770e76afb9d2f, was written
# before the last two fixes landed and never named a tree that existed; the digests above are the run's.)
# WHAT THE RE-RUN DID FIND, which no gate here reads and the PLAN's status log carries: the tail floor
# removes the out-of-order word that was tripping `run_align`'s `line-sync` retime, so three base-bundle
# cases publish their word document instead of the text's line timings (`rap-god` drop20 ±500-of-text
# 100.00 -> 87.93 is the one loss no earlier tree had; pooled drop20 90.48 -> 88.98, extraverse
# 90.69 -> 89.66, credit 88.72 -> 88.61, gross and `high_gross` 0 throughout).
#
#   # sections 1 + 2 — the shipped default, both levels
#   cd worker && .venv/bin/python ../docs/benchmarks/forced-alignment/scripts/e2e.py \
#       --level time_text --modes all,wrongtext+ownclock \
#       --compare ../docs/benchmarks/forced-alignment/results/w4b-base-time_text.json \
#       --gates ../docs/benchmarks/forced-alignment/gates/w6.yaml
#   #   …and the same at --level run_align against results/w4b-base-run_align.json.
#
#   # section 3 — the flip re-tried. The control is the run ABOVE, not a recorded row.
#   cd worker && .venv/bin/python ../docs/benchmarks/forced-alignment/scripts/e2e.py \
#       --level time_text --modes all,wrongtext+ownclock --model HUBERT_ASR_LARGE \
#       --compare ../docs/benchmarks/forced-alignment/results/w6-base-time_text.json \
#       --gates ../docs/benchmarks/forced-alignment/gates/w6.yaml
#   #   …and the same at --level run_align against results/w6-base-run_align.json.
#
#   (offline, no decode: e2e.py --summarize <run>/rows.jsonl --compare ... --gates ...)
#
# Gates are the CONDITION THAT MUST HOLD (the negation of the reject-if); see e2e_gates.py for the language.
# `base.` is the `--compare` cell of whichever invocation is running, which is why every relative gate here is
# a "not worse than the cell it is compared against" form and therefore says something true in both.

# ── 1. MUST: bounding the ladder cost the SHIPPED DEFAULT nothing ──────────────────────────────────────────
# W4's six absolutes (`gates/w4b.yaml` MUST 1 reads the same six at the same literals) plus the highlight the
# ends paint. READ on the shipped default at BOTH levels: 83.52 / 95.04 / 86.7 / 38.2 / 80.02 / 77.58,
# identical to the digit at `time_text` and `run_align`, so the clamp's 39–43 pulled lines per pass cost none
# of them.
w6-jamendo-word-pm100: truth.jamendo.word_pm100 >= 83.25
w6-jamendo-word-pm300: truth.jamendo.word_pm300 >= 94.98
w6-jamendo-word-aae: truth.jamendo.word_aae_ms <= 87.8
w6-jamendo-word-medae: truth.jamendo.word_medae_ms <= 38.2
w6-jamendo-word-end-pm100: truth.jamendo.end_pm100 >= 80.02
w6-jamendo-highlight: truth.jamendo.highlight >= 77.10
# THE ONE RECORDED COST, capped at what it measures rather than waived (`gates/w6-ladder.yaml` argues it):
# the trimmed line's LAST word now ends at the neighbour's boundary, and a last word is a phrase-final one.
# 59.23 against W4's 59.83, on 2 more scored ends (704 against 702).
w6-jamendo-final-end-pm100-known-cost: truth.jamendo.final_end_pm100 >= 59.2
# ±500 may not go DOWN 0.3 pt in the claim mode the wave is aimed at. It goes UP: Jamendo 96.42 -> 97.00,
# pooled 89.4 -> 90.61 at both levels.
w6-truth-pm500-not-down: truth.pm500 >= base.truth.pm500 - 0.3
w6-truth-jamendo-pm500-not-down: truth.jamendo.pm500 >= base.truth.jamendo.pm500 - 0.3
# ONE GATE PER MODE, for the reason `gates/w4b.yaml` learned the hard way (its review r2, spec-9): a sum does
# not rise whenever one of its terms does. Every one of the sixteen falls or holds on the shipped default —
# `time_text` truth 3 -> 1, jit 37 -> 31, drop20 42 -> 29, extraverse 5 -> 1, credit 28 -> 23, blind 106 = 106;
# `run_align` drop20 13 -> 0, drop50 180 -> 178, the rest the same shape.
w6-pooled-gross-not-up-truth: truth.gross <= base.truth.gross
w6-pooled-gross-not-up-jit: mode("jit").gross <= base.mode("jit").gross
w6-pooled-gross-not-up-off05: off05.gross <= base.off05.gross
w6-pooled-gross-not-up-off15: off15.gross <= base.off15.gross
w6-pooled-gross-not-up-off3: off3.gross <= base.off3.gross
w6-pooled-gross-not-up-offm1: offm1.gross <= base.offm1.gross
w6-pooled-gross-not-up-tempo098: tempo098.gross <= base.tempo098.gross
w6-pooled-gross-not-up-tempo102: tempo102.gross <= base.tempo102.gross
w6-pooled-gross-not-up-drop20: drop20.gross <= base.drop20.gross
w6-pooled-gross-not-up-drop50: drop50.gross <= base.drop50.gross
w6-pooled-gross-not-up-extraverse: extraverse.gross <= base.extraverse.gross
w6-pooled-gross-not-up-headers: headers.gross <= base.headers.gross
w6-pooled-gross-not-up-credit: credit.gross <= base.credit.gross
w6-pooled-gross-not-up-blind: blind.gross <= base.blind.gross
# `high_gross` — a line the TV WIPES that is more than 2 s off — is the one number the wave must never trade
# for accuracy. 0 in all thirteen timed claim modes on both bundles and both levels. BLIND IS DELIBERATELY NOT
# IN THIS SUM: the confidence rule takes it 45 -> 3 (Jamendo 23 -> 0, YouTube 22 -> 3) and the residue is
# `gates/w6-conf.yaml`'s own pair of gates — zero on Jamendo, a named bound of three pooled — rather than a
# term folded into a total here, where a rise on either half would read as the other's.
w6-high-gross-zero-claim-modes: truth.high_gross + off05.high_gross + off15.high_gross + off3.high_gross + offm1.high_gross + tempo098.high_gross + tempo102.high_gross + drop20.high_gross + drop50.high_gross + extraverse.high_gross + headers.high_gross + credit.high_gross + mode("jit").high_gross == 0
# No song may pay for a pooled gain with a gross line of its own, in ANY mode. 0 on the shipped default at
# both levels (and the gate that the flip FAILS — see section 3).
w6-no-song-gains-gross: count(song.gross_up) == 0

# ── 2. MUST: wrong-text protection unchanged, on whichever bundle ships ───────────────────────────────────
# `wrongtext_pass` is a PERCENTAGE of the 320 cross-paired wrong texts, so 1/320 is 0.3125. Measured:
# `time_text` base 1/320 (the same single `LUNABLIND` pair W4b records) and HuBERT-L 0/320; `run_align`
# 0/320 on both bundles, which is the level production runs; `--sync-mode lines` 0/320 and 0/320 = 0/640.
# The gate is written at the LOOSEST of those, because it must hold whichever bundle the owner ships.
w6-wrongtext-at-most-one-of-320: mode("wrongtext").wrongtext_pass <= 0.32
w6-ownclock-none-of-320: mode("wrongtext+ownclock").wrongtext_pass == 0
# A wrong text must not merely score badly — it must not COMMIT, on EITHER rung. `published` counts the
# documents a wrong text put on disk and `line_sync` the LINE_SYNC commitments, which is the rung `--sync-mode
# lines` makes the only one and which `wrongtext_pass` alone would not see. The bound is the same 1 the
# percentage above allows (the `LUNABLIND` pair, `time_text`, base bundle) rather than 0, because a pass IS a
# commitment: 0 here with 0.32 there would be two gates that cannot both be satisfied by the same run.
# Measured: 1 at `time_text` on the base bundle, 0 at `time_text` on HuBERT-L, 0 at `run_align` on both, 0 in
# `lines` mode on both rungs (0/640).
w6-wrongtext-commits-at-most-one: mode("wrongtext").published + mode("wrongtext").line_sync + mode("wrongtext+ownclock").published + mode("wrongtext+ownclock").line_sync <= 1

# ── 3. THE FLIP GATE's four ABSOLUTE wins, read on the HuBERT run ─────────────────────────────────────────
# `gates/w4b.yaml` states the flip's relative half and is the file to run for it; these four are the wins the
# brief required the candidate to KEEP, which no relative file can express. All four PASS: 85.46 / 71.1 ms /
# 81.40, and `truth.jamendo.gross == 0` is how "Pure_Mids truth ±500 = 100.00" is stated in the gate language —
# `Pure_Mids_-_The_Leader` was the only Jamendo song with a gross line at `truth` (its never-sung line[0]), and
# with it gone the count is 0 and that song reads 100.00 in the per-song table.
# THEY ARE NOT THE REASON THE FLIP IS STILL OFF. What fails is `w6-no-song-gains-gross` above (tfr-chosen +3
# at drop20 and +1 at drop50, hello +3 at drop50, and 4 more songs at drop50/blind) together with
# `gates/w4b.yaml`'s `no-youtube-song-worse-at-truth-pm500` (tfr-chosen 85.29 -> 69.70, -15.59 pt) and
# `no-jamendo-song-worse-at-word-pm300` (Tom_Orlando -1.52) — a scatter of sub-second band misses, not a
# decision site. Run these on the BASE bundle and they read its own numbers (83.52 / 86.7 / 77.58 / gross 1),
# i.e. three FAILs, which is correct: they are the CANDIDATE's bar, not the default's.
flip-jamendo-word-pm100-kept: truth.jamendo.word_pm100 >= 85.0
flip-jamendo-word-aae-kept: truth.jamendo.word_aae_ms <= 75.0
flip-jamendo-highlight-kept: truth.jamendo.highlight >= 80.5
flip-jamendo-truth-gross-zero: truth.jamendo.gross == 0

