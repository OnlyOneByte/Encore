#       77.58 < 80.5, `truth.jamendo.gross` 1 (`Pure_Mids_-_The_Leader`'s never-sung line[0]). That is the
#       correct reading: section 3 is the CANDIDATE's bar, not the default's. At `run_align`, the same 29/33
