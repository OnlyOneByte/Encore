# The worker's checks on every PR that can change their result. Split from
# ci.yml so a core-only or docs-only change does not run them; ml.yml still runs every test.
#
# Actions are pinned by commit SHA (the tag is the comment beside it). No secrets: the token is read-only.
#
# The required status check is `worker-gate`, not `worker`: it runs on every PR and passes when `worker` passed or
# was skipped by the path filter, so a skipped PR never waits on "Expected".
name: CI · worker

# No `push: main`: a merge is a squash of a PR head that already passed here.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read # paths-filter lists the PR's files through the API

# A new push to a PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.9.30

jobs:
  changes:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      # What the worker's tests read: their own tree; core's wire contract, media paths and the cross-language
      # fixtures under core/tests/unit (worker-align-contract.json, bench-highlight-parity.json, cjk-join-ranges.json);
      # the benchmark scripts they import; docs/arch, whose alignment design doc two tests read; and the top-level
      # docs/*.md the worker's code cites, so the PR that breaks a pointer (test_docs_pointers) is the one that fails.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            worker:
              - 'worker/**'
              - 'core/src/lib/**'
              - 'core/tests/unit/contract/**'
              - 'core/tests/unit/lib/tv/*.json'
              - 'docs/benchmarks/**'
              - 'docs/arch/**'
              - 'docs/*.md'
              - '.github/workflows/ci-worker.yml'

  worker:
    name: worker
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      # Base + dev, no torch. `ffmpeg` (a bundled binary) is the one extra, so the codec checks run too.
      - run: uv sync --frozen --extra ffmpeg
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q -m "not ml"

  worker-gate:
    name: worker-gate
    needs: [changes, worker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          WORKER: ${{ needs.worker.result }}
        run: |
          echo "changes=$CHANGES worker=$WORKER"
          [ "$CHANGES" = success ] && { [ "$WORKER" = success ] || [ "$WORKER" = skipped ]; }
