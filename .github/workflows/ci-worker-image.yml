# Builds docker/worker.Dockerfile for linux/amd64 and linux/arm64 on every PR that can change the image, so an
# image that cannot build on one of them fails here rather than on a user's Apple Silicon or ARM box (#1209).
#
# Build only: nothing is pushed, and no secret is used. Each platform builds natively on its own runner (no
# emulation) and caches its layers in the Actions cache. Not a required check yet.
name: CI · worker image

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read # paths-filter lists the PR's files through the API

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      # What the image is built from: the Dockerfile, the worker's manifests and source, and the yt-dlp config it copies.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            image:
              - 'docker/worker.Dockerfile'
              - 'docker/yt-dlp.conf'
              - 'worker/**'
              - '.github/workflows/ci-worker-image.yml'

  build:
    name: worker image (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache: worker-image-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache: worker-image-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/worker.Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max
