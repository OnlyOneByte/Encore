# The `probe` project and `gate:measured` on every PR and every push to main, so a review reads one run here
# instead of re-running ~300 probes locally. Advisory: `probes` is not a required check.
#
# Hermetic as docs/E2E.md#running-in-docker prescribes: the tests run on an internal Docker network with no route
# out. Probes that need YouTube carry the `@youtube` tag, are left out here, and still run in nightly.yml.
#
# Actions are pinned by commit SHA (the tag is the comment beside it). No secrets: the token is read-only.
name: Probes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR, or to main, cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  PW_IMAGE: mcr.microsoft.com/playwright:v1.56.1-noble

jobs:
  run:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # bash, so the run gets -o pipefail and `| tee` cannot hide a failing exit code.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: probe 1/4, key: probe-1, args: --project=probe --shard=1/4 --grep-invert=@youtube }
          - { name: probe 2/4, key: probe-2, args: --project=probe --shard=2/4 --grep-invert=@youtube }
          - { name: probe 3/4, key: probe-3, args: --project=probe --shard=3/4 --grep-invert=@youtube }
          - { name: probe 4/4, key: probe-4, args: --project=probe --shard=4/4 --grep-invert=@youtube }
          - { name: gate:measured, key: gate-measured, args: --project=gate --project=gate-speed }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-probes-${{ runner.os }}-${{ hashFiles('core/bun.lock') }}
      # The image pins the browsers `@playwright/test` expects, so there is no browser install to cache.
      - name: image
        run: |
          docker build -q -t encore-pw - <<EOF
          FROM $PW_IMAGE
          RUN apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg && rm -rf /var/lib/apt/lists/*
          RUN npm install -g bun@$BUN_VERSION
          EOF
          docker network create --internal encore-hermetic
          mkdir -p ~/.bun/install/cache core/results
      - name: install and build
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e BUN_INSTALL_CACHE_DIR=/bun-cache \
            -v ~/.bun/install/cache:/bun-cache -v "$GITHUB_WORKSPACE:/w" -w /w/core \
            encore-pw sh -c 'bun install --frozen-lockfile && bun run build'
      - name: playwright
        env:
          ARGS: ${{ matrix.args }}
        run: |
          docker run --rm --network encore-hermetic --ipc=host --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e CI -e ARGS -e ENCORE_KEEP_CORE_LOG=1 -e PLAYWRIGHT_JSON_OUTPUT_FILE=results/results.json \
            -e PLAYWRIGHT_HTML_OUTPUT_DIR=results/html -e PLAYWRIGHT_HTML_OPEN=never \
            -v "$GITHUB_WORKSPACE:/w" -w /w/core encore-pw \
            bash -o pipefail -c 'bun x playwright test $ARGS --reporter=list,json,html 2>&1 | tee results/playwright.log'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probes-${{ matrix.key }}
          path: |
            core/results/
            core/tests/playwright/.artifacts/
          retention-days: 7

  probes:
    name: probes
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: probes-*
          path: downloaded
      - shell: bash
        env:
          RUN_RESULT: ${{ needs.run.result }}
        run: |
          node .github/scripts/probes-summary.mjs downloaded core/tests/playwright/specs | tee -a "$GITHUB_STEP_SUMMARY"
