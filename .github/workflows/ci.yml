# Core's checks on every PR, on a clean x86_64 box.
# The worker's are ci-worker.yml, so each runs only when its side can change. Probes and a random fuzz seed run
# in nightly.yml, the worker's ML suite in ml.yml.
#
# Actions are pinned by commit SHA (the tag is the comment beside it). No secrets: the token is read-only.
#
# The required status check is `core-gate`, not `core`: it runs on every PR and passes when `core` passed or was
# skipped by the path filter, so a skipped PR never waits on "Expected".
name: CI

# No `push: main`: a merge is a squash of a PR head that already passed here, and nightly.yml re-checks main.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read # paths-filter lists the PR's files through the API

# A new push to a PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      # A change that touches only the worker cannot change core's result. The README and docs/ stay in,
      # because core's `readme.test.ts` checks every link the README makes into them.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            core:
              - '**'
              - '!worker/**'
              - '!.github/workflows/ci-worker.yml'
              - '!.github/workflows/nightly.yml'
              - '!.github/workflows/ml.yml'

  core:
    name: core
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # In the image that pins the browsers `@playwright/test` 1.56.1 expects. Lint and the flow fuzz are their own
    # jobs beside this one (#1375): together they were ~23 of the 30 minutes, so the job timed out on slow runners.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ffmpeg makes the demo track the gate plays; bun comes from npm because the image has node, not unzip.
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg
      - run: npm install -g bun@${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('core/bun.lock') }}
      - run: bun install --frozen-lockfile
      # As the image's unprivileged user: a container job runs as root, and root ignores the chmod that
      # `layout.test.ts` uses to make a directory unremovable.
      - run: chown -R pwuser "$GITHUB_WORKSPACE" && su pwuser -c 'bun run test'
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run build
      - run: bun run deadcode
      - run: bun run gate:measured
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts
          path: core/tests/playwright/.artifacts/
          retention-days: 3

  core-lint:
    name: core-lint
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm install -g bun@${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('core/bun.lock') }}
      # A cold lint is ~9-12 min, almost all of it type-aware parsing; warm it is seconds (TL-07). Keyed on the
      # lockfile, and saved under the commit so every run refreshes it from the newest one. lint-cache.yml saves
      # it on `main`, the only scope a PR's first run can restore from.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('core/bun.lock') }}-${{ github.sha }}
          restore-keys: eslint-${{ runner.os }}-${{ hashFiles('core/bun.lock') }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint

  core-fuzz:
    name: core-fuzz
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg
      - run: npm install -g bun@${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('core/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The fuzzer's known-bad seeds (flow/fuzz-seeds.ts): fixed seeds, so this is the same run every time.
      - run: bun x playwright test --project=flow tests/playwright/specs/flow/fuzz.spec.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-fuzz
          path: core/tests/playwright/.artifacts/
          retention-days: 3

  # Each of the three passes, or all three were skipped by the path filter.
  core-gate:
    name: core-gate
    needs: [changes, core, core-lint, core-fuzz]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CORE: ${{ needs.core.result }}
          LINT: ${{ needs.core-lint.result }}
          FUZZ: ${{ needs.core-fuzz.result }}
        run: |
          echo "changes=$CHANGES core=$CORE lint=$LINT fuzz=$FUZZ"
          ok() { [ "$1" = success ] || [ "$1" = skipped ]; }
          [ "$CHANGES" = success ] && ok "$CORE" && ok "$LINT" && ok "$FUZZ"
