# Intel Arc GPU worker — compose OVERRIDE for docker/compose.yaml.
#
#   docker compose -f docker/compose.yaml -f docker/compose.intel.yaml \
#     --stems up -d
#
# Run from the repo root. There is no ./dev.sh compose flag for this one: the target is PARKED.
#
# PARKED. The deploy target moved to NVIDIA (see compose.cuda.yaml). Kept because the Arc box
# may come back. Reviving it needs worker code as well as wheels: worker/encore_worker/host/hardware.py
# probes cuda, then mps, then cpu, and has NO xpu probe, so an Arc box auto-detects as cpu.
#
# NOTE this uses the BASE Dockerfile. PyTorch ships native torch.xpu upstream, so intel-extension-for-pytorch
# should no longer be needed. The old IPEX-based Dockerfile.intel has been DELETED, and nothing in the worker
# imports IPEX any more. Recover the file from git history if a specific driver pairing ever turns out to
# need it.
#
# UNVERIFIED: no Arc hardware was ever available to run this. Every line below is reasoned from the
# repo and Intel's documentation, not measured.

services:
  worker:
    # PID-1 zombie reaping — see the note in the base compose.yaml. Restated
    # here because a reader of this override should not have to know Compose merge rules to see it.
    init: true
    build:
      args:
        # BLOCKED, and stated rather than left to fail at build time: the new worker selects its torch index
        # through an EXTRA (`[tool.uv.sources]` maps `cpu` and `cu128` to their own indexes), and there is no
        # `xpu` extra in worker/pyproject.toml. Reviving this target means adding one there — a lock
        # change, not a compose change. `TORCH_INDEX_URL` is inert here; the old worker read it, this one
        # does not.
        TORCH_EXTRA: cpu

    # No `environment:` block. The worker probes the device (cuda, then mps, then cpu: no xpu) and the
    # capability list itself, and advertises only what it can prove.
    #
    # ENCORE_DEVICE=xpu in docker/.env is the only way onto the GPU today: the worker passes it through to
    # torch and demucs unchecked. UNTESTED, like everything in this file.

    devices:
      # What actually makes the GPU visible. Without it torch.xpu.is_available() is false.
      - /dev/dri:/dev/dri

    # The render/video group IDs differ between distributions, so these are NUMERIC and host-specific:
    # check `getent group render video` on the host and correct them. Names are not portable here, and
    # the base file runs the worker as non-root uid 10001, which must be in the render group to open
    # the device nodes.
    group_add:
      - "44"  # video  — verify on the host
      - "993" # render — verify on the host; commonly 993 or 109

    # Sizing note if this box returns: an A310 has 4 GB of VRAM and 124 GB/s, an A380 6 GB and
    # 186 GB/s. The 11-second-window RoFormer checkpoints (485100 samples) are the ones that will
    # strain 4 GB — expect to need a reduced segment size, and expect a CUDA-style OOM rather than a
    # graceful downgrade. Both cards are also BELOW the aarch64 dev box on memory bandwidth (~300 GB/s),
    # and this workload measured memory-bound, so do not assume a speedup: measure it.
    #   docs/benchmarks/scripts/checkpoint_cost.py
