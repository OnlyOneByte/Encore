# yt-dlp options applied to EVERY invocation inside the worker image — yt-dlp reads /etc/yt-dlp.conf
# before the command line, so this covers every call site without threading a flag through each one.
# Command-line options still win, so `download_argv` stays the authority on format selection.
#
# Solving YouTube's player challenge needs a JavaScript runtime (deno, installed in the image) AND
# yt-dlp's solver script, which ships as an opt-in "remote component" rather than in the wheel. Without
# it the extractor falls back to a format set with NO audio-only streams and the cook dies at download.
#
# THE TRADE-OFF: enabling this means the worker downloads and runs JavaScript from yt-dlp's own
# distribution channel during a cook. The alternative is no YouTube source audio at all. It is also
# necessary but NOT sufficient — a datacenter IP can be served a minimal format set however well the
# challenge is solved, so read docs/deploy/README.md before concluding this file is broken.
--remote-components ejs:github
