# Encore — one container for the MVP. The worker is gated behind the `stems` profile:
#   ./dev.sh compose up                    # MVP: core only
#   ./dev.sh compose --stems up       # core + the worker that makes karaoke tracks
#
# ── WHY THE PATHS BELOW LOOK ODD ─────────────────────────────────────────────────────────────────
# Compose resolves relative bind mounts AND loads `.env` from the PROJECT DIRECTORY, which defaults to
# the folder holding this file — so here that is `docker/`, not the repo root. Three consequences, each
# handled explicitly rather than by accident:
#
#   1. `name:` is set below. Without it the project name comes from the project directory's base name,
#      which would be `docker` — renaming every container and, worse, the `worker-cache` volume to
#      `docker_worker-cache`. That orphans the existing model cache (whisper and demucs checkpoints plus
#      the separation zoo, hundreds of MB per model) and silently re-downloads it.
#   2. `.env` lives in `docker/`, beside this file, so interpolation finds it with no flags.
#   3. Bind-mount defaults are `../data` and `../media` — they must climb OUT of docker/ to reach the
#      repo root, where they were before this file moved.
#
# The build CONTEXT is `..` (the repo root) because both images copy from sibling trees: core.Dockerfile
# reads `core/`, worker.Dockerfile reads `worker/`. That is also why `.dockerignore` stays at the repo
# root — Docker reads it from the build context, never from beside the Dockerfile.
#
# Hardening on every service: the app is a plain HTTP/WS server needing no Linux capabilities, so
# dropping them shrinks the blast radius of any RCE. Runs non-root (see each Dockerfile's USER).

# Pinned, NOT derived from the directory name. See note 1 above — this one line is what keeps the
# named volumes and container names stable across this file's move.
name: encore

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  core:
    <<: *hardening
    build:
      context: .. # the repo root: core.Dockerfile copies from core/
      dockerfile: docker/core.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MEDIA_STORE=${MEDIA_STORE:-local}
      # The address the TV's join QR advertises. UNSET = derived from the request, right for phones and
      # tunnels. Set it (e.g. http://192.168.1.20:3000) where /tv's own host cannot reach its public
      # address — notably WSL2, where the QR would otherwise tell every phone to connect to itself.
      - ENCORE_PUBLIC_ORIGIN=${ENCORE_PUBLIC_ORIGIN:-}
      # Storage classes, split by REPLACEABILITY (docs/ARCHITECTURE.md §6). Each defaults under
      # MEDIA_DIR — point any one at its own volume to separate the disks.
      - MEDIA_DIR=/app/media
      - ENCORE_AUDIO_DIR=/app/media/audio # raw originals — NOT regenerable; this is what to back up
      - ENCORE_DERIVED_DIR=/app/media/derived # stems/pitch/lyrics/thumbs — safe to delete, recomputable
      - ENCORE_META_DIR=/app/media/meta # sidecar records — the authoritative library
      # Shared secret on role=worker upgrades. Passed to BOTH services from docker/.env: compose's .env only
      # feeds `${}` substitution, so a key not listed here never reaches the container.
      - ENCORE_WORKER_TOKEN=${ENCORE_WORKER_TOKEN:-}
      # Passed through when set, and left unset otherwise. A value exported in the shell that runs compose
      # WINS over docker/.env and is forwarded too (an AWS_* key on a dev box, say). Core-only: the Spotify
      # and S3/AWS credentials never reach the worker. In-container paths are pinned above, not here.
      # core/tests/unit/server/container-layout.test.ts fails when core reads a setting this list misses,
      # or when this list names one core never reads.
      - ENCORE_ADMIN_TOKEN
      - ENCORE_MEDIA_MAX_GB
      - ENCORE_SONG_INTRO_MS
      - INTERSTITIAL_MS
      - ENCORE_LYRICS_BACKFILL
      - ENCORE_VOCALS_BACKFILL
      - ENCORE_EPHEMERAL
      - ENCORE_PUBLISH_STEM_FORMAT
      - SPOTIFY_CLIENT_ID
      - SPOTIFY_CLIENT_SECRET
      - S3_ENDPOINT
      - S3_BUCKET
      - S3_REGION
      - S3_PREFIX
      # Bun.S3Client reads these itself (object-store.ts passes only bucket, endpoint and region).
      # AWS_SESSION_TOKEN is what temporary credentials (STS, SSO, an assumed role) need.
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_REGION
      - AWS_ENDPOINT
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_SESSION_TOKEN
    volumes:
      # Host paths are overridable from docker/.env so the volumes can move without editing this file.
      # `../` because relative paths resolve against the PROJECT DIRECTORY, which is docker/ — see note 3
      # in the header. An override in .env should be an ABSOLUTE path to avoid inheriting that base.
      - ${ENCORE_DATA_VOLUME:-../data}:/app/data # sqlite (WAL)
      - ${ENCORE_MEDIA_VOLUME:-../media}:/app/media # audio + derived + meta + job scratch
    restart: unless-stopped

  # The only worker. A second, older service sat beside this one during the rewrite and was deleted at the
  # hard switchover, along with its `worker-cache` volume — so a machine that ran the old `stems` profile
  # still has an orphaned `encore_worker-cache` volume to reclaim with `docker volume rm`.
  worker:
    <<: *hardening
    # demucs/yt-dlp grandchildren reparent to this process, which runs as PID 1 and is not an init, so
    # they accumulate. `init: true` interposes Docker's tini instead.
    init: true
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
      args:
        # Which torch index, and so which accelerator. Overridden to `cu128` by the CUDA compose override.
        TORCH_EXTRA: ${ENCORE_TORCH_EXTRA:-cpu}
    profiles: ["stems"]
    environment:
      # `/ws?role=worker` — the path AND the role param are both required: core routes every socket
      # through one `/ws` endpoint and reads `role` to decide what the connection may do. A worker
      # dialling `/worker` is simply never upgraded, which looks exactly like the core being down.
      - ENCORE_CORE_URL=ws://core:3000/ws?role=worker
      # Appended by the worker as `&token=`; must match core's (see the core service).
      - ENCORE_WORKER_TOKEN=${ENCORE_WORKER_TOKEN:-}
      # Unset means the worker derives a per-machine id; a fixed default here would make every worker collide.
      - ENCORE_WORKER_ID=${ENCORE_WORKER_ID:-}
      # Everything below is OPTIONAL and unset by default: the worker measures its own accelerator and
      # installed engines at startup (host/hardware.py), so a wrong guess here is worse than no value. The
      # full list of worker variables is in the README's Configuration section.
      - ENCORE_DEVICE=${ENCORE_DEVICE:-}
      - ENCORE_WORKER_CONCURRENCY=${ENCORE_WORKER_CONCURRENCY:-}
      - ENCORE_ASR_MODEL=${ENCORE_ASR_MODEL:-base}
      - ENCORE_FLAC_LEVEL=${ENCORE_FLAC_LEVEL:-}
      - ENCORE_OFFLINE=${ENCORE_OFFLINE:-}
      - ENCORE_LRCMUX_URL=${ENCORE_LRCMUX_URL:-}
      - ENCORE_HTTPS_PROXY=${ENCORE_HTTPS_PROXY:-}
      # Passed through when set, and left unset otherwise; a value exported in the shell wins over
      # docker/.env. In-container paths and binaries stay the image's (worker.Dockerfile). The same test as
      # core's guards this list in both directions.
      - ENCORE_SEPARATOR_BACKEND
      - ENCORE_DEMUCS_JOBS
      - ENCORE_THREADS
      - ENCORE_ASR_COMPUTE
      - ENCORE_WARMUP
      - ENCORE_PUBLISH_STEM_FORMAT
      - ENCORE_LRCLIB_URL
      - ENCORE_ALIGN_MODEL
      - ENCORE_ALIGN_EXPERIMENTS
      - ENCORE_ANNOTATE
      - ENCORE_KEEPALIVE_SEC
      - ENCORE_JOB_CEILING_SEC
    volumes:
      # The SAME host path core mounts, or core serves a ref to a file this worker never wrote. The refs
      # themselves are computed by artifacts/keys.py, mirrored from core's paths.ts.
      - ${ENCORE_MEDIA_VOLUME:-../media}:/app/media
      # Model + tool cache, kept OUT of the writable layer so it survives `docker rm`. NAMED rather than a
      # bind path on purpose: Docker initialises a named volume from the image's own $XDG_CACHE_HOME so it
      # inherits the worker's ownership, whereas a fresh bind directory arrives root-owned and unwritable.
      - worker-cache:/home/worker/.cache
      # DURABLE STATE, and its own volume rather than a directory under the media mount: it holds in-flight
      # DBOS checkpoints, so it is per-box machine state and must survive `docker rm` while staying clear of
      # any retention sweep over `media/`.
      - worker-state:/home/worker/state
    depends_on:
      - core
    restart: unless-stopped

volumes:
  # Created only by the `stems` profile — the default MVP `up` never starts the worker that uses it.
  # Holds the ML model caches: whisper, demucs, and the ~135-model separation zoo, which are large and
  # expensive to refetch, so it lives outside the writable layer and survives `docker rm`.
  worker-cache:
  worker-state:
