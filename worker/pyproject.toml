# Static analysis for the Encore worker (container 2). The TS half of the monorepo runs
# `strict: true` + `noUncheckedIndexedAccess`; this file gives the Python half a linter,
# formatter and type checker so the two sides are gated to a comparable bar.
#
# `ruff` is one binary that replaces flake8 + black + isort: `ruff check` lints, `ruff format`
# formats. `mypy` type-checks the annotations that were already present but unchecked.
# Both are pinned in requirements-dev.txt and wired as blocking gates.

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# pycodestyle(E), pyflakes(F), isort(I), bugbear(B), pyupgrade(UP), tidy-imports(TID).
select = ["E", "F", "I", "B", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
# TID252 bans relative imports. The `src` package is LOAD-BEARING relative: the worker runs as
# `python -m src.dial_home` (Dockerfile:87) so `from . import protocol` is the correct intra-package
# form and forcing `src.*` absolute would contradict the container's documented entrypoint. Tests,
# by contrast, already import `from src.xxx import ...` (absolute) and historically carried a dead
# `sys.path.insert(...)` per file — so the ban is scoped to tests below.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# `src/` intra-package relative imports are intentional (see above); do not flag them.
"src/**/*.py" = ["TID252"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_return_any = true

# The ML stack ships no type stubs (torch/whisperx/etc. are C-extension or untyped). These are
# not our code and stubbing them is out of scope; declare the absence per-module so a genuine
# type error in OUR code is never drowned by "cannot find stub" noise. Anything imported here
# is a third-party dependency from requirements.txt, never an Encore module.
[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "torchaudio",
    "torchaudio.*",
    "whisperx",
    "whisperx.*",
    "pyannote",
    "pyannote.*",
    "pyannote.audio",
    "websockets",
    "websockets.*",
    "intel_extension_for_pytorch",
    "karaoke_lyrics_processor",
    "pyloudnorm",
    "pyloudnorm.*",
]
ignore_missing_imports = true
