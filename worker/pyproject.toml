# Static analysis for the Encore worker (container 2), gated to a bar comparable to the TS half's
# `strict: true` + `noUncheckedIndexedAccess`. `ruff` is one binary replacing flake8 + black + isort;
# `mypy` type-checks the annotations. Both are pinned in requirements-test.txt.

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# pycodestyle(E), pyflakes(F), isort(I), bugbear(B), pyupgrade(UP), tidy-imports(TID).
select = ["E", "F", "I", "B", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
# TID252 bans relative imports, but the `src` package is LOAD-BEARING relative: the worker's entrypoint
# is `python -m src.dial_home` (worker/Dockerfile CMD), so `from . import protocol` is the correct
# intra-package form. Tests already import `src.*` absolutely, so the ban is scoped to them below.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# `src/` intra-package relative imports are intentional (see above); do not flag them.
"src/**/*.py" = ["TID252"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_return_any = true

# The ML stack ships no type stubs (C-extension or untyped). Declare the absence per-module so a genuine
# type error in OUR code is never drowned by "cannot find stub" noise. Every name here is a third-party
# dependency from requirements.txt, never an Encore module.
[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "torchaudio",
    "torchaudio.*",
    "whisperx",
    "whisperx.*",
    "pyannote",
    "pyannote.*",
    "pyannote.audio",
    "websockets",
    "websockets.*",
    "intel_extension_for_pytorch",
    "karaoke_lyrics_processor",
    "pyloudnorm",
    "pyloudnorm.*",
    "soundfile",
]
ignore_missing_imports = true
