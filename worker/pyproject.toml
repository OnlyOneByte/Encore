[project]
name = "encore-worker"
version = "0.1.0"
description = "Encore worker — durable audio/lyrics processing as DBOS workflows"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "OnlyOneByte" }]
requires-python = ">=3.12"

# The RUNTIME set that is not ML. Everything heavy is an extra below, so `uv sync` on a dev box
# costs no multi-GB download — the test suite fakes every heavy seam and must stay runnable
# without torch. That property was deliberate in the old worker (requirements-test.txt existed
# only to preserve it) and is now expressed in the dependency graph rather than in two files.
dependencies = [
    # >=3.1: the async surface this design depends on is 3.x — coroutine workflows/steps,
    # `DBOS.asyncio_wait` (durable `asyncio.wait`), durable streams (`write_stream_async`) for progress,
    # and `preemptible` async steps. Locked at 3.1.0.
    "dbos>=3.1",
    "websockets==15.0.1",
    # Pinned because yt-dlp ships breaking extractor changes often. Shelled out to by name via PATH,
    # but declared so a venv install is self-sufficient.
    "yt-dlp==2026.8.19",
    # The songProfile analysis (key detection, vocal range) is pure numpy and lives in `domain/audio/`, so
    # numpy is a BASE dependency rather than part of `ml`: those algorithms must be testable against
    # synthesised signals on a box with no models, which is the property every Protocol here exists to keep.
    # ~20 MB, so it does not break "uv sync costs no multi-GB download".
    "numpy>=2.1",
]

[project.optional-dependencies]
# torch/torchaudio/torchvision MUST match minor exactly: a drifting torchaudio wheel carries an
# incompatible C++ ABI and fails as `ImportError: undefined symbol`. demucs/whisperx/pyannote were
# resolved together against this set — do NOT re-pin any one of them without re-resolving the group.
#
# `cpu` and `cu128` differ ONLY in which index torch comes from (see [tool.uv.sources]); the pins are
# identical, so a box switching backends does not silently move model versions too.
cpu = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
]
cu128 = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
]
# The model stack itself, independent of which torch index served the tensors.
ml = [
    "demucs==4.0.1",
    # A RELEASE CANDIDATE, deliberately, and the reason is a dependency bound rather than a feature:
    #
    #     3.8.6      requires  huggingface-hub<1.0.0
    #     3.8.7rc1   requires  huggingface-hub>=0.28.1   (no ceiling)
    #
    # and `mlx-audio` requires huggingface-hub>=1.0. On 3.8.6 the two are unsatisfiable together, so MLX
    # separation had to run in a sidecar virtualenv behind a subprocess. The rc removes the bound, which
    # removes the sidecar, the `ENCORE_MLX_AUDIO_PYTHON` knob and its probe.
    #
    # 3.8.6 is still the newest STABLE; the rc has sat since 2026-06-26 with no final, so "wait for 3.8.7"
    # is not a short wait. Verified rather than assumed: all 10 `-m ml` tests — real whisper transcription
    # and real wav2vec2 forced alignment — pass on it, and pass with the two major bumps it pulls in
    # (huggingface-hub 0.36->1.33, transformers 4.57->5.17). Move to 3.8.7 final when it lands; it should
    # be a one-line change.
    #
    # DIARIZATION IS *NOT* COVERED BY THOSE TESTS, and this comment said it was. `pyannote/speaker-
    # diarization-3.1` is HF-gated, so a real end-to-end diarization cannot run unattended. What IS
    # asserted (tests/test_ffmpeg.py) is the input contract against the real pyannote loader — which is
    # where the actual defect was.
    "whisperx==3.8.7rc1",
    "pyannote.audio==4.0.0",
    "bs-roformer-infer==0.1.5",
    "soundfile>=0.13",
    "pyloudnorm==0.2.0",
    "scipy==1.16.2",
    # SYLLABIFICATION for the karaoke ball (alignment v2). Both are pure-python and tiny next to torch.
    # `cmudict` is the CMU pronouncing dictionary — phoneme-based, so it knows "come" is ONE syllable where
    # orthography says two. NOT `pronouncing`: that package still imports `pkg_resources`, which this venv
    # (correctly) does not carry, so it fails at import on any modern install. `pyphen` is hyphenation
    # dictionaries for ~70 languages, the non-English tier. The naive vowel-group fallback in
    # domain/lyrics/syllabify.py keeps a box without either working.
    "cmudict==1.1.1",
    "pyphen==0.17.2",
]
# The Apple-Silicon separation backend. NOT a Python import: `host/backends.py` gates on
# `find_spec("demucs_mlx")` and the engine shells out to the `demucs-mlx` CLI by name, so this extra
# exists to put that binary on PATH rather than to be imported. Pulls NO torch in its default install
# (torch appears only in its own `convert` extra), so it cannot move the pin the alignment stack uses.
# Marker-gated because mlx builds only on Apple Silicon; `--extra mlx` on a Linux box installs nothing
# rather than failing.
mlx = [
    "demucs-mlx==1.4.14; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Mel-Band RoFormer on Metal: the fastest separator measured on this project — 0.55x realtime against
    # roughly 3x for the CPU roformer path on the same clip — and MIT end to end (Apache-2.0 package, MIT
    # architecture code, MIT weights). IN-PROCESS, which only became possible with the whisperx rc above.
    "mlx-audio>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Required to IMPORT A SEPARATOR, which is an upstream packaging wart rather than a real need:
    # `mlx_audio/sts/models/__init__.py` eagerly imports Moshi, so the TTS stack comes along. Declared here
    # so it fails at install time rather than as a ModuleNotFoundError on the first stems job.
    "sentencepiece; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# THE MODEL ZOO, and the reason this worker can offer ~90 separators instead of 3. One package carries the
# VR, MDX, MDX23C and RoFormer architectures — 84 of the 89 catalogue entries are RoFormer checkpoints,
# against the 10 that `bs-roformer-infer` shipped — plus an upstream `models-scores.json` with per-model
# vocals/instrumental SDR that lets an operator rank them instead of guessing from filenames.
#
# PINNED TO 0.45.0 RATHER THAN 0.47.0 ON PURPOSE, and the pin is what makes the zoo available on Apple
# Silicon at all:
#
#     0.46.0+   torch<3,>=2.13 ; sys_platform == 'darwin' and platform_machine == 'arm64'
#     0.45.0    torch>=2.3     (every platform)
#
# This project pins torch 2.8.0 for whisperx/demucs/pyannote, so 0.47.0 was UNINSTALLABLE on arm64 mac and
# the previous markers excluded it there — which meant the zoo did not exist on the machine this project is
# developed on. 0.45.0 carries the IDENTICAL catalogue (verified: same 89 entries, same 84 roformers), so
# the downgrade costs no models and buys the platform. Revisit if torch moves past 2.13.
#
# The old two-entry De Morgan split is gone with the markers it existed to express: there is no longer a
# platform to exclude, so there is no `or` marker for uv to fail to intersect.
audiosep = [
    "audio-separator==0.45.0",
    # AN UNDECLARED DEPENDENCY OF 0.45.0, not a preference. `separator/uvr_lib_v5/spec_utils.py` does a
    # bare `import audioread` and the release's metadata does not list it, so `Separator` fails to import
    # with ModuleNotFoundError on a clean install. Declared here so the failure happens at resolve time
    # rather than on the first zoo job. Drop it if a future pin lists its own dependencies correctly.
    "audioread>=3.0",
]

# A STATIC FFMPEG BINARY, shipped per-platform in the wheel. The worker shells ffmpeg on every path —
# yt-dlp's WAV postprocess, `decode_to_wav`, the FLAC and guide-mix encoders, the silence probe — and
# `hardware.capabilities` withholds `stems` entirely without it, so "the operator will have installed one"
# is a portability assumption this removes.
#
# AN EXTRA RATHER THAN A BASE DEPENDENCY, because it strictly adds. `host.ffmpeg` falls back to PATH, so a
# minimal install behaves exactly as it does today; installing this only removes the requirement to have
# ffmpeg at all. As a base dependency it would instead BREAK the platforms it has no wheel for
# (musl/Alpine, BSD, ppc64le), which is the opposite of the goal.
#
# CHOSEN OVER THE ALTERNATIVES on two facts, both checked rather than assumed:
#   * `static-ffmpeg` ships a 0-byte py3-none-any wheel and DOWNLOADS the binary on first use — a runtime
#     network fetch is precisely the portability failure being removed here.
#   * `ffmpeg-binaries` has no linux-aarch64 wheel, so it cannot serve an ARM server or a CI runner.
# imageio-ffmpeg 0.6.0 ships real wheels for macos arm64/x86_64, manylinux2014 x86_64/aarch64 and win, at
# 20-31 MB, BSD-2. Verified its binary is a full FFmpeg 7.1 carrying every codec and filter this worker
# uses: flac, opus, aac, vorbis, pcm_s16le, pcm_s24le, and the amix/join/volume/loudnorm filters.
ffmpeg = [
    "imageio-ffmpeg==0.6.0",
]

# Text extraction for operator-pasted lyrics files, plus LANGUAGE IDENTIFICATION for the text that is
# about to be aligned (review M8 / §3 item 9, W7; `domain/lyrics/language.py`).
#
# WHY lingua AND NOT langdetect/fasttext/langid, on the three facts that matter to THIS caller rather than on
# published accuracy tables: it is the one that can be RESTRICTED TO A CLOSED SET of languages
# (`from_iso_codes_639_1`), which is what this worker needs — naming a language whisperx tables no alignment
# model for is WORSE than answering English, so the detector must not be able to say `sw`. Its n-gram models
# are IN the wheel, so there is no runtime download and an offline room still identifies a language
# (`Config.offline` makes that a real case, not a hypothetical). And it is accurate on the SHORT, repetitive
# text a lyric sheet is, where langdetect's character-trigram profiles are weakest.
#
# Apache-2.0 (2.x is `lingua-rs` with pyo3 bindings, so these are PLATFORM WHEELS and not pure Python —
# cp312/cp313/cp314 for macos arm64/x86_64, manylinux aarch64/x86_64 and win, which covers every platform
# this project builds for; a platform without one simply has no detector, which is a degradation and not a
# failure, see below). PINNED EXACTLY, like every other model-adjacent pin here: a detector that changed its
# mind about a song between two releases would re-route it to another bundle, and the bundle decides which
# `lexical.CALIBRATED` row gates the words.
#
# WHAT IT COSTS AT RUNTIME, measured rather than inferred from the wheel size: 0.05 s to build the detector,
# 0.11 s for the first detection, 3 ms for every one after it, 34 MB resident (the n-gram models load lazily
# per language). Against the ~5-9 s emission pass it chooses the bundle for, that is free.
#
# AN EXTRA AND NOT A BASE DEPENDENCY, and `domain/lyrics/language.py` degrades rather than raising without
# it: the wheel is ~170 MB of n-gram data, and its absence costs accuracy on non-English LATIN-script songs
# ONLY — the SCRIPT half of the decision is stdlib `unicodedata`, so a Japanese or Korean sheet routes to its
# own bundle on a box that never installed this. It is also what keeps every row under
# `docs/benchmarks/forced-alignment/results/` reproducible: no detector means Latin script stays on the
# English bundle, which is exactly the configuration those rows were measured on.
text = [
    "pyperclip==1.11.0",
    "docx2txt==0.9",
    "striprtf==0.0.33",
    "lingua-language-detector==2.2.0",
]

# DISPLAY-ONLY ROMANISATION for the non-Latin lane (review §3 item 12 stage 0, W8;
# `domain/lyrics/romanize.py`). A second script printed UNDER the original line, never instead of it and
# never an alignment target — so this extra adds a field to a published document and moves nothing the
# aligner reads.
#
# LICENCES DECIDED THE BACKENDS, not accuracy tables, because this tree ships no GPL code:
#   * pypinyin 0.55.0 — MIT, pure Python, phrase dictionary in the wheel (0.8 MB). Toned pinyin for zh.
#   * cutlet 0.5.2 — MIT, Hepburn romaji for ja. NOT pykakasi, which is GPL-3.0 and is the reason this
#     line is pinned by name: its dependencies are jaconv (MIT), fugashi (MIT) and mojimoji (Apache-2.0).
#   * unidic-lite 1.0.8 — fugashi's MeCab dictionary, which cutlet needs and does not declare (it reads
#     UniDic's own `pron`/`kana` features, so IPAdic cannot stand in). The PACKAGING is MIT; the UniDic
#     2.1.2 data inside it is triple-licensed GPL-2.0 / LGPL-2.1 / BSD-3-Clause and is taken here under
#     BSD-3-Clause. 47 MB, the whole weight of this extra.
#   * uroman 1.3.1.1 — Apache-2.0, universal romanisation tables, the backend for every other non-Latin
#     script (Hangul, Cyrillic, Arabic, Hebrew, Greek, Devanagari, …) so a script this project never
#     measured still prints something readable rather than nothing.
#
# AN EXTRA AND NOT A BASE DEPENDENCY, and `domain/lyrics/romanize.py` degrades rather than raising without
# it: `build_romanizer` answers None for every language, no line gains a `romanization` field, and every
# recorded row reproduces — which is the configuration all of `docs/benchmarks/forced-alignment/results/`
# was measured on, the `results/w8-lane-*-romanized-run_align` rows aside.
#
# IN THE DEFAULT INSTALL SINCE W10 even so: `dev.sh` and `docker/worker.Dockerfile` both sync it, because
# the lane is otherwise readable in a test and not in a room, and because the per-language stage-2 table
# needs the TARGET-side transliteration to route zh or ko to MMS_FA at all (docs/arch/04-alignment.md §9.2).
# Still an extra, so `uv sync --only-group dev` installs none of it and the hermetic tests keep asserting
# the absent behaviour.
#
# MMS_FA ITSELF IS NOT HERE AND IS NOT A PYTHON PACKAGE: `torchaudio.pipelines.MMS_FA` (torchaudio is
# BSD-2-Clause) fetches Meta AI's forced-aligner weights into the user's own torch hub cache at runtime.
# Those weights are CC-BY-**NC** 4.0 — usable here, Encore being non-commercial — and nothing is
# redistributed by this tree, but the BY term still asks for attribution: _MMS: Scaling Speech Technology
# to 1,000+ Languages_, Pratap et al., Meta AI (2023). Full note: docs/arch/04-alignment.md §14.2.
romanize = [
    "pypinyin==0.55.0",
    "cutlet==0.5.2",
    "unidic-lite==1.0.8",
    "uroman==1.3.1.1",
]

# THE NON-LATIN LANE'S TEXT TOOLING (review §3 item 12 stage 1, W8; `domain/lyrics/units.py`) — the ALIGNMENT
# side, where `romanize` above is the display side. Both are absent by default, so every row under
# `docs/benchmarks/forced-alignment/results/` reproduces: `units.rules` answers the whitespace rule and
# `units.simplified` is the identity without them.
#
#   * fugashi 1.5.2 — MIT, the MeCab binding whose SURFACE FORMS are a Japanese word. Already installed as
#     cutlet's dependency and named here because this module imports it directly; a dictionary comes from
#     `unidic-lite` in `romanize`, and without one `units.words` falls back to the mora rule.
#   * opencc-python-reimplemented 0.1.7 — Apache-2.0, PURE PYTHON (the `opencc` binding needs platform
#     wheels), Traditional -> Simplified for the simplified-only zh-cn vocabulary. 0.015 s to build the
#     converter and 20 us a conversion, and it is reached only for a character the vocabulary lacks.
#
# IN THE DEFAULT INSTALL SINCE W10, with `romanize`, for the same reason and under the same caveat: fugashi
# with no dictionary falls back to the mora rule, so the two extras are synced together (see `romanize`).
nonlatin = [
    "fugashi==1.5.2",
    "opencc-python-reimplemented==0.1.7",
]

[project.urls]
Homepage = "https://github.com/OnlyOneByte/Encore"
Repository = "https://github.com/OnlyOneByte/Encore"

[dependency-groups]
# PEP 735. A plain `uv sync` (base + this group) runs the fast suite, `pytest -m "not ml"`, and the lint and
# type gates, with no ML download at all. `--only-group dev` drops the base dependencies, so it runs ruff and
# nothing else.
dev = [
    "pytest==8.4.2",
    # asyncio_mode=auto is this plugin's setting — without it every async test is silently skipped
    # as an un-awaited coroutine rather than failing.
    "pytest-asyncio==1.4.0",
    # A wedged test fails alone instead of erasing the rest of the run's signal.
    "pytest-timeout==2.4.0",
    # EXACT, not `>=`: a formatter's output is part of the gate, so a newer minor can turn
    # `ruff format --check` red on files nobody touched.
    "ruff==0.16.8",
    "mypy==2.3.1",
    # THE `ml` EXTRA'S LIGHT HALF, which the fast suite needs and which pulls no torch. The tests write
    # their audio fixtures with soundfile and reach loudness, filters and syllables through the rest, so
    # without these 20 test modules fail at import on a bare `uv sync` (TL-01). Same specs as `ml`, so the
    # lock resolves them once; each ships wheels (or is pure Python) for every platform this project builds.
    "soundfile>=0.13",
    "pyloudnorm==0.2.0",
    "scipy==1.16.2",
    "cmudict==1.1.1",
    "pyphen==0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["encore_worker"]
# PACKAGE DATA, named rather than left to the default. hatchling already includes non-Python files inside a
# packaged directory, and `domain/lyrics/data/mhyph.xz` is version-controlled, so this line adds no file —
# it is here because that file's ABSENCE is a silent degradation rather than an ImportError
# (`syllabify._moby` returns an empty table and the ladder falls back to pyphen, which abstains on 44.8% of
# multi-syllable tokens), so a future `exclude`/`only-include` must have to edit this line to drop it.
# `tests/test_packaging.py` asserts both halves: the pattern is declared, and the file loads through
# `importlib.resources` with the entry count the module's docstring claims.
include = ["encore_worker/domain/lyrics/data/*.xz"]

# ── uv ────────────────────────────────────────────────────────────────────────────────────────────
# WHY uv AND NOT poetry/pdm. Three reasons specific to this worker: it manages the INTERPRETER (worker
# boxes ship python3 older than this project's floor — the host running this scaffold has 3.10.13);
# it has first-class support for per-extra package indexes, which is the only clean way to express
# "same torch pin, different wheel index per backend"; and it shares a vendor and release cadence
# with ruff, which the gates already pin exactly.

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# `explicit` so NOTHING resolves from here unless a [tool.uv.sources] entry says to. Without it this
# index shadows PyPI for every package it happens to carry.
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[tool.uv]
# Declaring the two backends MUTUALLY EXCLUSIVE is what lets one lockfile hold both: uv resolves a
# separate branch per extra instead of trying to satisfy two torch indexes at once (which is
# unsatisfiable, and without this is a resolution error rather than a clear message).
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

# ── ruff ──────────────────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 110

[tool.ruff.lint]
# pycodestyle(E), pyflakes(F), isort(I), bugbear(B), pyupgrade(UP), tidy-imports(TID).
select = ["E", "F", "I", "B", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
# Relative imports INSIDE the package are the correct intra-package form; tests import absolutely.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"encore_worker/**/*.py" = ["TID252"]

# ── mypy ──────────────────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
# `tests` INCLUDED, from day one. The TypeScript half of this repo learned the cost of not doing this:
# its test tree was type-checked by nothing (the app config excludes it), 284 errors accumulated, and
# four genuine ones were hiding in them — including a duplicated mid-file import block. Gating a tree is
# nearly free when it is empty and expensive once it is not.
files = ["encore_worker", "tests"]
strict = true
warn_unused_ignores = true
warn_return_any = true
# `assert_never` in the verdict dispatch only fails the build if exhaustiveness is actually checked.
enable_error_code = ["exhaustive-match"]

# The ML stack ships no type stubs (C-extension or untyped). Declared per-module so a genuine type
# error in OUR code is never drowned by "cannot find stub" noise. Every name here is third-party.
[[tool.mypy.overrides]]
module = [
    "audio_separator.*",
    "bs_roformer_infer.*",
    "cmudict",
    "cutlet",
    "demucs.*",
    "docx2txt",
    "fugashi",
    "imageio_ffmpeg",
    "lingua",
    "opencc",
    "pyannote.*",
    "pyphen",
    "pyloudnorm.*",
    "pyperclip",
    "pypinyin",
    "scipy.*",
    "soundfile",
    "striprtf.*",
    "torch.*",
    "torchaudio.*",
    "uroman",
    "websockets.*",
    "whisperx.*",
]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
# Without asyncio_mode=auto every async test is silently skipped rather than failing.
asyncio_mode = "auto"
testpaths = ["tests"]
# `--strict-markers` because the DESELECTION is load-bearing here, not cosmetic. A typo'd
# `@pytest.mark.mls` is only a warning by default, and `-m 'not ml'` then happily runs a test that needs
# 500 MB of checkpoints — so the fast suite fails on a box with no models, and the real failure looks like
# a broken test rather than a broken marker. `--strict-config` gives the same treatment to this table.
addopts = ["--strict-markers", "--strict-config"]
markers = [
    # Launches a real DBOS instance against a temp SQLite file. Seconds rather than milliseconds, so it
    # is deselectable with `-m 'not dbos'` — but it is the ONLY thing that exercises the durable path.
    "dbos: end-to-end through a real DBOS instance",
    "allow_network: this test genuinely needs outbound network access",
    # Drives REAL models against REAL audio. Downloads checkpoints on first use and takes tens of
    # seconds; needs the `ml` extra installed. `-m 'not ml'` for the fast suite.
    "ml: exercises real ML models rather than Protocol fakes",
]
timeout = 120
timeout_method = "thread"
