[pytest]
# Worker (container 2) unit tests. asyncio_mode=auto so async test fns run without per-test markers.
asyncio_mode = auto
testpaths = tests

# PRIMARY per-test wall-clock backstop — pytest-timeout (pinned in requirements-test.txt): a wedged test
# fails ALONE at 60s instead of hanging the run and erasing every later file's signal. 60s is generous; the
# green suite finishes in seconds. timeout_method=thread works even inside code that has masked SIGALRM.
timeout = 60
timeout_method = thread

# BACKSTOP — native faulthandler, set higher than the plugin bound so it only fires for a hang the
# plugin's thread method cannot interrupt (a C-level block that never returns to Python). Worse than the
# plugin (no summary, later files skipped) but it is the last line of defence. faulthandler_timeout is
# supported on the pinned pytest 8.4.2; faulthandler_exit_on_timeout (pytest 9.x only) is deliberately
# NOT set — on 8.4.2 it is an unknown key that warns rather than errors, i.e. a silent fail-open.
faulthandler_timeout = 90
