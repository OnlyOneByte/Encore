# yt-dlp options applied to EVERY invocation inside the worker image.
#
# yt-dlp reads /etc/yt-dlp.conf before the command line, so this covers every call site (source
# download, metadata probes) without threading a flag through each one. Command-line options still
# win, so `download_argv` stays the authority on format selection.
#
# WHY --remote-components. Solving YouTube's player challenge (the signature and `n` parameters)
# needs TWO things: a JavaScript runtime, and yt-dlp's challenge-solver script. The runtime (deno) is
# installed in the image; the solver is distributed as a "remote component" and is deliberately
# opt-in, because yt-dlp fetches and executes it at run time rather than shipping it in the wheel.
#
# Without it, deno alone is not enough: yt-dlp reports "Signature solving failed" and "n challenge
# solving failed", the extractor falls back to a format set containing NO audio-only streams, and the
# cook dies at download. Measured on this stack — with the runtime present but the solver skipped,
# the only surviving format was the legacy muxed 18 (360p mp4).
#
# NECESSARY BUT NOT SUFFICIENT — do not read the above as "install deno and downloads work". Measured
# from inside the built image on a datacenter host, with the whole chain demonstrably live (yt-dlp
# logged this config, detected deno-2.9.6, downloaded the ejs solver and ran it, reporting no signature
# or n-challenge failure), YouTube STILL offered only storyboards and the legacy muxed 18 for a
# mainstream video: no adaptive streams at all, and a format identical to the one chosen with this
# config removed.
#
# So a second, independent cause can produce the same symptom: the format set is also restricted by WHO
# IS ASKING, and a datacenter IP can be served a minimal one no matter how well the challenge is solved.
# The practical consequences are worth stating because they are easy to get backwards. A cook that fails
# to find an audio-only format is NOT evidence that this config or the runtime is broken. Verify from
# the host that will actually run the worker, since a residential connection and a datacenter one get
# different answers. And the selector's bare `best` final branch is what keeps such a host working at
# all -- see FORMAT_SELECTOR in stream_quality.py, where every `bestaudio` branch misses this format.
#
# The trade-off is explicit and worth knowing: enabling this means the worker downloads and runs
# JavaScript from yt-dlp's own distribution channel during a cook. The alternative is no YouTube
# source audio at all.
--remote-components ejs:github
