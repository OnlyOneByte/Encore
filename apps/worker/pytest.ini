[pytest]
# Worker (container 2) unit tests. asyncio_mode=auto so async test fns run without per-test markers.
asyncio_mode = auto
testpaths = tests

# ── per-test wall-clock backstop (issue #291) ────────────────────────────────────────────
# A wedged test (e.g. a non-reentrant-lock deadlock, or a C-level block that never yields) used to
# hang the WHOLE run: pytest stops at the wedged item, every later test file never runs, and there is
# no failing name, no assertion, no summary — one regression turns the entire ~627-test signal into
# silence. #180 added bounded pre-probes on KNOWN wedge paths (test_align_plan.py); this is the
# suite-level backstop for a NEW wedge on an unprobed path. Owner-ratified option C on the issue.
#
# PRIMARY — pytest-timeout (pinned in requirements-dev.txt): fails ONLY the offending test at 60s and
# lets the rest of the suite run, so one wedge no longer erases the whole run's signal. 60s is generous
# — the full green suite finishes in ~5s, so no healthy test comes close. timeout_method=thread dumps
# the stack from a watchdog thread and works even inside code that has masked SIGALRM.
timeout = 60
timeout_method = thread

# BACKSTOP — native faulthandler, set higher than the plugin bound so it only fires for a hang the
# plugin's thread/SIGALRM method cannot interrupt (a C-level block that never returns to Python). It
# dumps all thread tracebacks naming the wedged frame at file:line, then the process ends — worse than
# the plugin (no summary, later files skipped) but it is the last line of defence for the case the
# plugin structurally cannot break. faulthandler_timeout is supported on the pinned pytest 8.4.2;
# faulthandler_exit_on_timeout (pytest 9.x only) is deliberately NOT set — on 8.4.2 it is an unknown
# key that warns rather than errors, which is exactly the silent fail-open this issue is about.
faulthandler_timeout = 90
